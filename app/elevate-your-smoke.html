<style>
:root{
  --bg:#ECEAE4; --surface:#F7F6F2; --surface2:#FFFFFF; --ink:#101412;
  --muted:#5E6660; --line:rgba(16,20,18,.12); --accent:#E85D04; --accent-text:#A03E02; --accent-ink:#1A0F08;
  --olive:#2F3B2A; --olive-soft:#3F4F38; --danger:#C43C2C; --shadow:0 18px 50px rgba(16,20,18,.18);
  --disp:'Syne',system-ui,sans-serif; --body:'Outfit',system-ui,-apple-system,sans-serif; --mono:'Outfit',system-ui,sans-serif;
  --radius:18px; --radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;display:flex;justify-content:center;color:var(--ink);font-family:var(--body);
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(232,93,4,.28), transparent 55%),
    linear-gradient(165deg,#1a2218 0%, #2a3526 42%, #6d7464 100%);
}
#app{
  width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.sheet{padding:0 20px 56px;flex:1;display:flex;flex-direction:column;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.masthead{
  margin:0 -20px 18px;padding:16px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;
  background:linear-gradient(135deg,var(--olive),var(--olive-soft));color:#F4F7EE;border-bottom:0;
}
.masthead h1{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.02em;margin:0;text-transform:none;line-height:1}
.masthead .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-top:5px;display:block;font-weight:500}
.masthead .brand{min-width:0}
@media (max-width:400px){.masthead h1{font-size:19px}}
.masthead .no{font-size:11px;letter-spacing:.08em;opacity:.8;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.display{font-family:var(--disp);font-weight:800;letter-spacing:-.03em;line-height:.95;margin:0}
.h-xl{font-size:48px}.h-lg{font-size:34px}.h-md{font-size:24px;letter-spacing:-.02em}
p.lede{font-size:15.5px;line-height:1.55;color:#2c322e;margin:14px 0 0}
.fine{font-size:12.5px;line-height:1.5;color:var(--muted)}
.rule{height:1px;background:var(--line);margin:16px 0}
.rule.thin{height:1px;background:var(--line)}
.block{border:1px solid var(--line);background:var(--surface2);padding:14px;margin:0 0 12px;border-radius:var(--radius-sm)}
.block.invert{background:var(--olive);color:#F4F7EE;border-color:transparent}
.block.invert .eyebrow{color:rgba(244,247,238,.65)}
.btn{
  display:block;width:100%;border:0;background:var(--ink);color:#F7F6F2;border-radius:999px;
  font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:none;
  padding:15px 18px;cursor:pointer;box-shadow:none;transition:transform .12s ease, background .12s ease, opacity .12s ease;
  text-decoration:none;text-align:center;box-sizing:border-box;
}
a.btn{color:#F7F6F2}
a.btn.ghost{color:var(--ink)}
a.btn.accent{color:var(--accent-ink)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.ghost:active{transform:scale(.98)}
.btn.sm{font-size:14px;padding:12px 16px}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.linkbtn{background:none;border:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-soft);
  cursor:pointer;padding:12px 8px;min-height:44px;text-decoration:underline;text-underline-offset:3px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center}
.linkbtn:hover,.linkbtn:focus-visible{color:var(--accent-text)}
a.linkbtn{color:var(--olive-soft)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.progress{display:flex;gap:5px;margin-bottom:8px}
.progress i{flex:1;height:4px;background:rgba(16,20,18,.1);border:0;border-radius:99px}
.progress i.on{background:var(--ink)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);
  background:var(--surface2);padding:13px 14px;margin-bottom:9px;cursor:pointer;font-family:var(--body);
  transition:border-color .12s, background .12s, transform .12s;border-radius:var(--radius-sm)}
.opt:hover{border-color:rgba(16,20,18,.28)}
.opt .box{flex:0 0 22px;height:22px;border:1.5px solid var(--ink);border-radius:7px;display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:14px;line-height:1;color:transparent}
.opt.sel{background:var(--ink);color:#F7F6F2;border-color:var(--ink)}
.opt.sel .box{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt .t{font-weight:600;font-size:15px;display:block}
.opt .s{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.opt.sel .s{color:rgba(247,246,242,.7)}
.buildline{font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;opacity:0;animation:fadein .35s forwards}
.buildline b{color:var(--olive-soft);font-weight:700}
@keyframes fadein{to{opacity:1}}
.statrow{display:flex;border:0;background:transparent;gap:8px}
.statrow div{flex:1;padding:14px 10px;text-align:center;border:0;background:var(--surface2);border-radius:var(--radius-sm)}
.statrow .n{font-family:var(--disp);font-weight:800;font-size:28px;line-height:1}
.statrow .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.weeks{display:flex;flex-direction:column;gap:7px}
.wk{display:flex;align-items:center;gap:7px}
.wk .lab{font-size:10px;color:var(--muted);width:20px;letter-spacing:.06em;font-weight:600}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;flex:1}
.cells.six{grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border:0;display:grid;place-items:center;font-family:var(--disp);
  font-weight:700;font-size:13px;color:var(--muted);background:rgba(16,20,18,.06);position:relative;border-radius:10px}
.cell.train{color:var(--ink);background:var(--surface2)}
.cell.next{background:var(--ink);color:var(--accent)}
.cell.done{background:rgba(232,93,4,.35);color:var(--olive)}
.cell.done::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--olive);bottom:5px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 0 4px 27px}
.dow span{text-align:center;font-size:9px;color:var(--muted)}
.movelist{margin:0;padding:0;list-style:none}
.movelist li{border-bottom:1px solid var(--line)}
.movelist li:last-child{border-bottom:0}
.mrow{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:11px 0;
  font-family:var(--body);font-size:14px;text-align:left;cursor:pointer;color:inherit}
.mrow .k{font-size:10px;letter-spacing:.08em;color:var(--muted);flex:0 0 50px;text-transform:uppercase;font-weight:600}
.mrow .m{flex:1;font-weight:600}
.mrow .d{font-size:12px;color:var(--muted)}
.mrow .see{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--olive-soft);letter-spacing:0}
.player{position:fixed;inset:0;background:#0E110F;z-index:50;display:flex;flex-direction:column;
  max-width:430px;margin:0 auto;color:#F4F7EE}
.player.rest{background:linear-gradient(180deg,#243022,#1a2218)}
.ptop{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.ptop .st{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:600}
.pmid{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:0 18px 10px;text-align:center;overflow:hidden;min-height:0}
.timer{font-family:var(--disp);font-weight:800;font-size:56px;line-height:.85;font-variant-numeric:tabular-nums;margin:8px 0 0;letter-spacing:-.04em}
.timer.big{font-size:88px}
.movename{font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1;margin:10px 0 0;text-transform:none}
.cue{font-size:14px;line-height:1.45;margin:8px 0 0;color:rgba(244,247,238,.78)}
.player.rest .cue{color:rgba(244,247,238,.85)}
.nextup{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:12px;opacity:.55;font-weight:600}
.figslot{flex:0 0 auto;margin:0 -18px 4px;min-height:0}
.demotip{margin:10px auto 0;max-width:340px;text-align:left;border-top:2px solid var(--accent);padding:10px 0 6px;background:transparent}
.demotip .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,247,238,.55);display:block;margin-bottom:3px;font-weight:600}
.demotip .txt{font-size:13px;line-height:1.4;color:rgba(244,247,238,.9)}
.player.rest .demotip{display:none}
.howdots{display:flex;justify-content:center;gap:5px;margin-top:8px}
.howdots i{width:6px;height:6px;border:0;border-radius:50%;background:rgba(244,247,238,.25)}
.howdots i.on{background:var(--accent)}
.pbot{padding:12px 18px 8px;display:flex;gap:10px}
.pbot .btn{margin:0}
.playermore{margin:0 18px 14px;border-top:1px solid rgba(244,247,238,.14);padding-top:8px}
.playermore>summary{list-style:none;cursor:pointer;color:rgba(244,247,238,.72);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:10px 4px;min-height:44px;display:flex;align-items:center;justify-content:center}
.playermore>summary::-webkit-details-marker{display:none}
.playermore[open]>summary{color:#F4F7EE}
.playermore .moreacts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding-bottom:4px}
.playermore .linkbtn{color:rgba(244,247,238,.78)}
.playermore .linkbtn:hover,.playermore .linkbtn:focus-visible{color:var(--accent)}
.player .btn{background:var(--accent);color:var(--accent-ink);border-radius:999px}
.player .btn.ghost{background:rgba(244,247,238,.08);color:#F4F7EE;border:1px solid rgba(244,247,238,.18)}
.player.rest .btn{background:var(--accent);color:var(--accent-ink);border:0;box-shadow:none}
.player.rest .btn.ghost{background:transparent;color:#F4F7EE;border:1px solid rgba(244,247,238,.25);box-shadow:none}
.bar{height:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform .3s linear;will-change:transform}
.player.rest .bar i{background:var(--accent)}
.stampwrap{display:grid;place-items:center;padding:26px 0 10px}
.stamp{width:150px;height:150px;border:3px solid var(--accent);border-radius:50%;display:grid;place-items:center;
  color:var(--accent-ink);background:var(--accent);transform:none;box-shadow:none;animation:press .45s cubic-bezier(.16,1,.3,1) both}
.stamp span{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.02em;text-align:center;line-height:.95}
.stamp small{display:block;font-size:11px;letter-spacing:.1em;margin-top:6px;opacity:.7;font-weight:600}
@keyframes press{from{transform:scale(1.35);opacity:0}to{transform:scale(1);opacity:1}}
.launch{
  margin:12px 0 0;padding:12px;border-radius:var(--radius-sm);background:var(--surface2);
  border:1px solid var(--line);
}
.launch .eyebrow{margin-bottom:10px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cd div{text-align:center;background:rgba(16,20,18,.05);border-radius:10px;padding:10px 4px}
.cd .n{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.cd .l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.launch .fine{margin:10px 0 0}
.demobtn{
  display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 0;padding:12px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface2);cursor:pointer;text-align:left;color:inherit;font-family:var(--body);
}
.demobtn:hover{border-color:var(--accent)}
.demobtn .play{
  flex:0 0 44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:16px;font-weight:800;
}
.demobtn .t{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:-.02em;display:block}
.demobtn .s{font-size:12px;color:var(--muted);margin-top:2px;display:block}
.leaguepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.leaguepick button{
  border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:14px 10px;background:var(--surface2);
  font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:-.02em;cursor:pointer;color:var(--ink);text-align:left;
}
.leaguepick button small{display:block;font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--muted);margin-top:4px}
.leaguepick button.on{border-color:var(--accent);background:rgba(232,93,4,.12)}
.tabs.league{margin-top:8px}
.promo-ov{position:fixed;inset:0;z-index:80;background:rgba(10,12,10,.88);display:flex;align-items:center;justify-content:center;padding:18px;animation:fadein .2s ease both}
.promo-ov .box{width:min(520px,100%);background:#0c100a;border-radius:16px;overflow:hidden;border:1px solid rgba(244,237,224,.12)}
.promo-ov video{display:block;width:100%;height:auto;background:#000;aspect-ratio:4/3;object-fit:cover}
.promo-ov .cap{
  min-height:64px;padding:12px 14px;font-size:14px;line-height:1.4;color:#F4EDE0;background:#121610;
  border-top:3px solid var(--accent);
}
.promo-ov .actions{display:flex;gap:8px;padding:12px 14px 14px;background:#121610}
.promo-ov .actions .btn{margin:0}
video::cue{background:rgba(16,20,18,.75);color:#F4EDE0;font-family:Outfit,system-ui,sans-serif;font-size:15px;line-height:1.35}
.field{margin:14px 0 6px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input{width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;
  font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--ink);
  padding:4px 2px;border-radius:0;-webkit-appearance:none}
.field input::placeholder{color:var(--muted);opacity:1}
.person{border-bottom:1px solid var(--line);padding:12px 0}
.person.cold{opacity:.45}
.tabs{display:flex;gap:6px;margin:14px 0 4px}
.tabs button{
  flex:1;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:10px 8px;
  font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--muted);
}
.tabs button.on{background:var(--ink);color:#F7F6F2;border-color:var(--ink)}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 4px}
.metrics div{background:rgba(16,20,18,.05);border-radius:10px;padding:8px 6px;text-align:center}
.metrics div.hi{background:rgba(232,93,4,.16);outline:1.5px solid var(--accent)}
.metrics .v{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1}
.metrics .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:600}
.rank{font-family:var(--disp);font-weight:800;font-size:14px;color:var(--accent-text);flex:0 0 28px}
.sortkey{font-family:var(--disp);font-weight:800;font-size:18px;color:var(--ink);letter-spacing:-.02em}
.sortlab{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;text-align:right}
.wtrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:10px}
.wtrow .field{margin:0}
.wtrow .field input{
  font-family:var(--body);font-weight:600;font-size:15px;letter-spacing:0;
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2);width:100%;
}
.wtrow .btn{width:auto;padding:12px 16px;margin:0}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pn{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pd,.pm{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:500}
.pbar{height:6px;border:0;margin:8px 0 5px;background:rgba(16,20,18,.08);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--olive-soft);border-radius:99px}
.note{border-left:0;border-top:2px solid var(--accent);padding:10px 0 8px;margin:16px 0 0;font-size:13px;line-height:1.5;color:var(--muted);background:transparent}
.hidden{display:none}
.figbox{display:none}
.fig,.figmini,.fighero{display:none}
.eximg{display:block;width:100%;height:auto;object-fit:cover;background:#121610;pointer-events:none}
.eximg.mini{width:72px;height:72px;flex:0 0 72px;border-radius:14px;object-fit:cover}

/* ---------- figure renderer ---------- */
const REDUCED=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function clearRafs(){
  S.rafs.forEach(id=>cancelAnimationFrame(id));S.rafs=[];
  if(S.countdown){clearInterval(S.countdown);S.countdown=null}
}
function figureNode(name,cls){
  const ex=EX[name],wrap=document.createElement('div');
  wrap.className='figbox '+(cls||'');
  if(!ex)return wrap;
  wrap.innerHTML='<svg class="fig" viewBox="0 0 120 84" role="img" aria-label="Diagram of '+name+'"></svg>';
  const svg=wrap.querySelector('svg'),props=propsSVG(ex.props);
  const draw=u=>{svg.innerHTML=props+bodySVG(lerpPose(ex.a,ex.b,u))};
  if(REDUCED()){draw(1);return wrap}
  const t0=performance.now();
  const loop=()=>{
    if(!wrap.isConnected)return;
    const u=(1-Math.cos((performance.now()-t0)/2400*Math.PI*2))/2;
    draw(u);S.rafs.push(requestAnimationFrame(loop));
  };
  loop();
  return wrap;
}
function staticFigure(name,cls){
  const ex=EX[name],wrap=document.createElement('div');
  wrap.className='figbox '+(cls||'');
  if(!ex)return wrap;
  wrap.innerHTML='<svg class="fig" viewBox="0 0 120 84" aria-hidden="true">'+propsSVG(ex.props)+bodySVG(ex.b)+'</svg>';
  return wrap;
}
function exerciseSlug(name){
  return String(name).normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function exerciseImgSrc(name){return 'exercises/'+exerciseSlug(name)+'.jpg'}
function exerciseVidSrc(name){return 'exercises/'+exerciseSlug(name)+'.mp4'}
/** Still poster for lists/grids — never autoplay video thumbs (manual/brief). */
function exercisePoster(name,cls){
  const img=document.createElement('img');
  img.className='eximg'+(cls?' '+cls:'');
  img.src=exerciseImgSrc(name);
  img.alt=name+' — form demo';
  img.loading='lazy';img.decoding='async';
  img.width=860;img.height=573;
  return img;
}
/** Looping form demo — player + detail overlay only (one at a time). */
function exerciseImg(name,cls){
  const v=document.createElement('video');
  v.className='eximg'+(cls?' '+cls:'');
  v.src=exerciseVidSrc(name);
  v.poster=exerciseImgSrc(name);
  v.muted=true;v.defaultMuted=true;v.autoplay=true;v.loop=true;v.playsInline=true;
  v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
  v.setAttribute('aria-label',name+' — form demo');
  v.preload=cls==='hero'?'auto':'metadata';
  v.width=860;v.height=573;
  v.addEventListener('error',()=>{
    if(v.dataset.fell)return;v.dataset.fell='1';
    v.replaceWith(exercisePoster(name,cls));
  },{once:true});
  return v;
}
function prefetchExerciseMedia(name){
  if(!name||!EX[name])return;

    const img=new Image();
    img.decoding='async';
    img.src=exerciseImgSrc(name);

const WEEK={3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};
const DAYS=30,SESSION_SEC=540,RESUME_VERSION=2,MIN_COMPLETE_MS=Math.floor(540*1000*0.85);
function expectedSessions(perWeek){
  const days=WEEK[perWeek]; if(!days)return 0;
  let n=0; for(let i=0;i<DAYS;i++) if(days.includes(i%7)) n++;
  return n;
}
function scheduleLabel(p){
  const total=p?schedule(p).filter(s=>s.train).length:0;
  const pw=p&&p.days?p.days:0;
  return {total, perWeek:pw, recovery:DAYS-total};
}
const FOCUS={A:'Push \u00b7 Legs \u00b7 Core',B:'Pull \u00b7 Hips \u00b7 Core',C:'Full-body conditioning'};

function pick(cat,lvl,avoid,offset){
  const list=M[cat].filter(m=>!m.t.includes(avoid));
  const i=Math.min(list.length-1,Math.max(0,lvl-1+(offset||0)));
  return list[i]||list[list.length-1];
}
function levelFor(p,block){
  let l=p.level;
  if(p.age==='60')l=Math.max(1,l-1);
  if(p.age==='45'&&l>2)l=2;
  if(p.goal==='move')l=Math.max(1,l-1);
  if(block>=2)l=Math.min(4,l+1);
  return l;
}
function profileReady(p){
  return !!(p && WEEK[p.days] && p.level>=1 && p.goal && p.gear && p.limit && p.age);
}
function schedule(p){
  const days=WEEK[p&&p.days],out=[];let n=0;
  for(let i=0;i<DAYS;i++){
    const train=!!(days&&days.includes(i%7));
    out.push({i,block:Math.floor(i/10),train,type:train?['A','B','C'][n++%3]:null});
  }
  return out;
}
function buildSession(slot,p){
  const lvl=levelFor(p,slot.block),av=p.limit==='none'?'':p.limit;
  const work=lvl<=1?20:25,rest=30-work,rounds=3;
  const gearPull=p.gear==='bar'?1:0;
  let main;
  if(slot.type==='A')main=[pick('push',lvl,av),pick('squat',lvl,av),pick('core',lvl,av),pick('cardio',lvl,av,-1)];
  else if(slot.type==='B')main=[pick('pull',lvl+gearPull,av),pick('hinge',lvl,av),pick('core',lvl,av,1),pick('cardio',lvl,av,-1)];
  else main=[pick('cardio',lvl,av),pick('squat',lvl,av,-1),pick('push',lvl,av,-1),pick('core',lvl,av)];
  const steps=[],b=slot.block,d=slot.i;
  [M.warm[d%M.warm.length],M.warm[(d+2)%M.warm.length]]
    .forEach(m=>steps.push({kind:'work',phase:'Warm-up',n:m.n,c:m.c,sec:30}));
  for(let r=1;r<=rounds;r++){
    main.forEach((m,i)=>{
      steps.push({kind:'work',phase:'Round '+r+' of '+rounds,n:m.n,c:m.c,sec:work});
      const last=(r===rounds&&i===main.length-1);
      steps.push({kind:'rest',phase:'Rest',n:'Rest',c:last?'Last bout coming. Breathe. Brace.':'Shake it out. Nose breathe. Reset the plank line.',sec:rest});
    });
  }
  steps.push({kind:'work',phase:'Finisher',n:main[3].n,c:'Everything left. Steady cadence. No sloppy reps.',sec:60});
  const cd=M.cool.filter(m=>!m.t.includes(av));
  [cd[d%cd.length],cd[(d+1)%cd.length]]
    .forEach(m=>steps.push({kind:'work',phase:'Cool-down',n:m.n,c:m.c,sec:30}));
  return {type:slot.type,block:b,day:d,steps,main,rounds,work,rest,lvl};
}
const mins=s=>Math.round(s.steps.reduce((a,b)=>a+b.sec,0)/60);

const COACH_BASE='audio/coach/';
function coachStop(){
  try{ if(S._coachAudio){ S._coachAudio.pause(); S._coachAudio.src=''; S._coachAudio=null; } }catch(e){}
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}

function coachSpeakFallback(text){
  if(S.muted||!text||!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.rate=1.06; u.pitch=0.92; u.volume=1; u.lang='en-US';
    const voices=speechSynthesis.getVoices()||[];
    const prefer=[/guy neural/i,/andrew/i,/christopher/i,/daniel/i,/premium/i,/enhanced/i,/natural/i,/google us english/i,/samantha/i,/aaron/i,/aria/i];
    let pick=null;
    for(const re of prefer){ pick=voices.find(v=>re.test(v.name||'')&&/^en/i.test(v.lang||'')); if(pick)break; }
    if(!pick) pick=voices.find(v=>/^en(-|_)US/i.test(v.lang||''))||voices.find(v=>/^en/i.test(v.lang||''));
    if(pick) u.voice=pick;
    speechSynthesis.speak(u);
  }catch(e){}
}
function coachPlayFile(file, fallbackText){
  if(S.muted||!file)return;
  try{
    coachStop();
    const a=new Audio(COACH_BASE+file);
    a.preload='auto';
    S._coachAudio=a;
    const fail=()=>{ if(fallbackText) coachSpeakFallback(fallbackText); };
    a.addEventListener('error', fail, {once:true});
    const p=a.play();
    if(p&&p.catch) p.catch(fail);
  }catch(e){ if(fallbackText) coachSpeakFallback(fallbackText); }
}
function coachCue(key, fallbackText){
  if(fallbackText) announce(fallbackText);

function coachPhase(phase){

  if(/warm/.test(p)) return coachCue('warm','Warm-up. Loosen up. Elevate.');
  if(/circuit|work block|main/.test(p)) return coachCue('circuit','Circuit. Stay locked in.');
  if(/finish/.test(p)) return coachCue('finisher','Finisher. Empty the tank.');

function beep(kind){
  if(S.muted)return;
  // Voice is primary; skip oscillator chirps so cues feel live, not synthetic.
  if(S._coachAudio || (window.speechSynthesis&&speechSynthesis.speaking)) return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx)return;
    if(!S._ac)S._ac=new Ctx();
    const ac=S._ac; if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';
    o.connect(g);g.connect(ac.destination);
    o.frequency.value=kind==='end'?740:(kind==='warn'?620:480);
    g.gain.value=0.02; o.start();

  }catch(e){}
}

function advanceResumeAcrossGap(resume, steps, now){
  if(!resume||!steps||!steps.length) return null;
  if(resume.v!==RESUME_VERSION) return null;
  let si=Math.max(0, Number(resume.si)||0);
  let remainingMs=Math.max(0, Number(resume.remainingMs)||0);
  let elapsed=Math.max(0, Number(resume.elapsedActiveMs)||0);
  const paused=!!resume.paused;
  if(si>=steps.length) return {si, remainingMs:0, elapsedActiveMs:elapsed, paused:false, done:true};
  if(!remainingMs) remainingMs=Math.round((steps[si].sec||0)*1000);
  if(!paused){
    let gap=Math.max(0, now-(Number(resume.savedAt)||now));
    while(gap>0 && si<steps.length){
      if(gap<remainingMs){ remainingMs-=gap; elapsed+=gap; gap=0; }
      else { gap-=remainingMs; elapsed+=remainingMs; si++; remainingMs=si<steps.length?Math.round((steps[si].sec||0)*1000):0; }
    }
  }
  return {si, remainingMs:Math.round(remainingMs), elapsedActiveMs:Math.round(elapsed), paused, done:si>=steps.length};
}

/* =========================================================
   ROSTER SYNC  —  identity, reporting, organizer dashboard
   ========================================================= */
const QKEY='smoke30:queue';
const API=()=>{
  try{const q=new URLSearchParams(location.search).get('api');if(q)return q}catch(e){}
  const u=(CONFIG.SYNC_URL||'').trim();
  if(!u)return '';
  // Relative /api only works when the app is served over http(s), not from disk
  if(u.startsWith('/')&&typeof location!=='undefined'&&location.protocol==='file:')return '';
  return u;
};
const tracking=()=>!!API();

/* ---- identity: callsign (participant) + optional board display name ---- */
function setMe(name,league,displayName){
  const prev=S.me||{};
  const dn=displayName!=null?String(displayName).trim().slice(0,32):(prev.displayName||'');
  S.me={id:prev.id||('p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)),
        name:name.trim().slice(0,32),joined:prev.joined||Date.now(),
        league:league||prev.league||'',
        displayName:dn};
  save();return S.me;
}
function boardNameOf(me){
  if(!me)return '';
  const d=String(me.displayName||'').trim();
  return d||String(me.name||'').trim();
}
/* ---- transport: never blocks the workout; failures go in a queue ---- */
async function apiPost(body){
  if(!tracking())return null;
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  const t=ctrl?setTimeout(()=>ctrl.abort(),12000):null;
  try{
    const r=await fetch(API(),{method:'POST',redirect:'follow',signal:ctrl?ctrl.signal:undefined,
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    return await r.json();
  }finally{ if(t)clearTimeout(t); }
}
function queueAdd(b){try{const q=JSON.parse(localStorage.getItem(QKEY)||'[]');q.push(b);
  localStorage.setItem(QKEY,JSON.stringify(q.slice(-40)))}catch(e){}}
async function flushQueue(){
  if(!tracking())return;
  let q=[];try{q=JSON.parse(localStorage.getItem(QKEY)||'[]')}catch(e){return}
  if(!q.length)return;
  const left=[];
  for(const b of q){try{await apiPost(b)}catch(e){left.push(b)}}
  try{localStorage.setItem(QKEY,JSON.stringify(left))}catch(e){}
}
function buildReportBody(action, extras){
  const sl=S.profile?schedule(S.profile):[];
  const total=sl.filter(s=>s.train).length;
  const nextS=S.profile?nextSlot():null;
  const totalSessions=total||expectedSessions(S.profile&&S.profile.days)||0;
  const day=action==='log'&&S.slot?S.slot.i+1:(nextS?nextS.i+1:(S.profile?30:0));
  const sessionsCount=action==='log'
    ? Object.keys(S.log).length+(S.slot&&!S.log[S.slot.i]?1:0)
    : Object.keys(S.log).length;
  const body={action,challenge:CONFIG.CHALLENGE,id:S.me.id,name:S.me.name,
    sessions:sessionsCount,total:totalSessions,streak:S.profile?streak():0,
    day,perWeek:S.profile?S.profile.days:0,
    league:S.me.league||''};
  if(S.me.displayName!=null) body.displayName=String(S.me.displayName||'');
  if(action==='log'){
    body.elapsedMs=Math.round((extras&&extras.elapsedMs!=null)?extras.elapsedMs:(S.elapsedActiveMs||0));
    body.idempotencyKey=S.me.id+'::'+CONFIG.CHALLENGE+'::'+day;
  }
  if(S.weights&&S.weights.starting!==''&&S.weights.starting!=null)body.startingWeight=Number(S.weights.starting);
  if(S.weights&&S.weights.current!==''&&S.weights.current!=null)body.currentWeight=Number(S.weights.current);
  if(extras&&extras.pin) body.pin=String(extras.pin);
  if(S.profile||S.log) body.card={profile:S.profile||null,log:S.log||{}};
  return body;
}
function report(action, extras){
  if(!tracking()||!S.me)return Promise.resolve(null);
  const body=buildReportBody(action, extras);
  return apiPost(body).catch(err=>{
    const q={...body}; delete q.pin;
    queueAdd(q);
    throw err;
  });
}

function renderRoster(body,people){
  body.innerHTML='';

  const wk=Date.now()-7*864e5;
  const active=people.filter(p=>p.lastActive>wk).length;
  const done=people.filter(p=>p.total&&p.sessions>=p.total).length;
  body.appendChild(el(`<div class="statrow" style="margin-top:16px">

  people.sort((a,b)=>(b.lastActive||0)-(a.lastActive||0)).forEach(p=>{

    const cold=p.lastActive<wk;
    const row=el(`<div class="person${cold?' cold':''}">

        <span class="pd">${esc(ago(p.lastActive))}</span></div>

      if(!p.name)return;
      if(!confirm('Remove '+p.name+' from the roster?'))return;
      try{
        const r=await fetch('/api/roster/delete',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({pin:S.pin,challenge:CONFIG.CHALLENGE,name:p.name})});
        const d=await r.json();
        if(!d.ok){alert(d.error==='bad pin'?'Organizer code rejected.':'Could not delete.');return}
        renderRoster(body,people.filter(x=>x!==p));
      }catch(e){alert('Could not reach the roster.')}
    };
    body.appendChild(row);
  });
  body.appendChild(el('<p class="fine" style="margin-top:14px">Faded rows have not trained in the last seven days. Trash removes them from your roster.</p>'));

/* ---- public leaderboard ---- */
const fmtHrs=h=> (h==null||h==='')? '—' : (Number(h).toFixed(Number(h)>=10?1:2).replace(/\.?0+$/,'')+'h');
const fmtPct=p=>{
  if(p==null)return '—';
  const n=Number(p);
  return (n>0?'+':'')+n.toFixed(1)+'%';
};
const fmtLossPct=p=>{
  if(p==null)return '—';
  const n=Number(p);
  if(!Number.isFinite(n))return '—';
  if(n>0) return n.toFixed(1)+'% lost';
  if(n<0) return Math.abs(n).toFixed(1)+'% gained';
  return 'No change';
};
function sortBoard(people, mode){
  const arr=(people||[]).slice();
  const m=mode||'points';
  if(m==='hours'){
    arr.sort((a,b)=>(Number(b.hours)||0)-(Number(a.hours)||0)
      ||(Number(b.sessions)||0)-(Number(a.sessions)||0)
      ||(Number(b.points)||0)-(Number(a.points)||0)
      ||String(a.name||'').localeCompare(String(b.name||'')));
  }else if(m==='weight'){
    arr.sort((a,b)=>{
      const aw=a.weightLostPct==null?-1e9:Number(a.weightLostPct);
      const bw=b.weightLostPct==null?-1e9:Number(b.weightLostPct);
      return bw-aw
        ||(Number(b.points)||0)-(Number(a.points)||0)
        ||String(a.name||'').localeCompare(String(b.name||''));
    });
  }else{
    arr.sort((a,b)=>(Number(b.points)||0)-(Number(a.points)||0)
      ||(Number(b.hours)||0)-(Number(a.hours)||0)
      ||String(a.name||'').localeCompare(String(b.name||'')));
  }
  return arr;
}
function primarySortValue(p, mode){
  if(mode==='hours') return {v:fmtHrs(p.hours),k:'Hours'};
  if(mode==='weight') return {v:p.weightLostPct==null?'—':fmtLossPct(p.weightLostPct),k:'Weight lost'};
  return {v:String(p.points||0),k:'Points'};
}

/* ---------- player ---------- */
function clearPlayerTimers(){
  if(S.tick){clearInterval(S.tick);S.tick=null}
  if(S.tipTick){clearInterval(S.tipTick);S.tipTick=null}
}
function syncDeadlineFromRemaining(){
  if(S.paused){ S.deadlineAt=null; }
  else { S.deadlineAt=Date.now()+Math.max(0,S.timeLeftMs||0); }
  S.lastTickAt=Date.now();
}
function remainingMsNow(){
  if(S.paused||!S.deadlineAt) return Math.max(0, Math.round(S.timeLeftMs||0));
  return Math.max(0, Math.round(S.deadlineAt-Date.now()));
}
function paintTimerUI(st){
  const rem=remainingMsNow();
  S.timeLeftMs=rem;
  const secLeft=Math.max(0, Math.ceil(rem/1000));
  if(secLeft!==S.timeLeft){
    S.timeLeft=secLeft;
    const t=document.getElementById('t'); if(t) t.textContent=mmss(secLeft);
  } else {
    S.timeLeft=secLeft;
  }
  const b=document.getElementById('barfill');
  if(b&&st&&st.sec) b.style.transform='scaleX('+(1-rem/(st.sec*1000))+')';
  if(!S.paused && (secLeft===3||secLeft===2||secLeft===1) && S.lastWarnSec!==secLeft){
    S.lastWarnSec=secLeft; vibe(30);
    const map={3:'three',2:'two',1:'one'};
    coachCue(map[secLeft], secLeft===1?'One. Go.':String(secLeft));
  }
  if(secLeft===0 && S.lastWarnSec!==0){ S.lastWarnSec=0; vibe([40,40,40]); }
}
function applyAdvancedState(adv){
  if(!adv)return;
  S.si=adv.si;
  S.timeLeftMs=adv.remainingMs;
  S.elapsedActiveMs=adv.elapsedActiveMs;
  S.paused=!!adv.paused;
  S.timeLeft=Math.max(0, Math.ceil((adv.remainingMs||0)/1000));
  if(adv.done){ S.si=S.session.steps.length; }
  syncDeadlineFromRemaining();
}
function catchUpRunning(){
  if(S.paused||!S.session) return {changed:false,done:false};
  const now=Date.now();
  const rem=S.deadlineAt!=null
    ? Math.max(0, Math.round(S.deadlineAt-(S.lastTickAt||now)))
    : Math.max(0, Math.round(S.timeLeftMs||0));
  const adv=advanceResumeAcrossGap({
    v:RESUME_VERSION, si:S.si, remainingMs:rem,
    elapsedActiveMs:S.elapsedActiveMs||0, paused:false, savedAt:S.lastTickAt||now
  }, S.session.steps, now);
  if(!adv) return {changed:false,done:false};
  const prevSi=S.si;
  const changed=adv.si!==prevSi || !!adv.done;
  applyAdvancedState(adv);
  S.lastTickAt=now;
  if(adv.done) return {changed:true,done:true};
  // Next step's coach voice carries the handoff — no "complete" chirp that gets cut off.
  return {changed, done:false};
}
function advanceRunningClock(){
  if(S.paused||!S.session) return false;
  const r=catchUpRunning();
  if(r.done) return 'done';
  return !!r.changed;
}
function startSession(fromResume){
  if(!challengeLive()){
    clearPlayerTimers(); clearRafs(); releaseWakeLock();
    document.querySelectorAll('.player').forEach(n=>n.remove());
    S.session=null; S.slot=null; S.screen='plan'; render();
    return;
  }
  if(!fromResume){
    S.si=0; S.paused=false; S.elapsedActiveMs=0; S.timeLeftMs=0; S.deadlineAt=null; S.lastWarnSec=null; S._coachPhase=null;
  }
  document.querySelectorAll('.player').forEach(n=>n.remove());
  document.body.appendChild(el('<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Nine minute workout"></div>'));
  requestWakeLock();
  if(!window._eysVis){
    window._eysVis=true;
    document.addEventListener('visibilitychange',()=>{
      if(!document.getElementById('player'))return;
      if(document.hidden){
        if(!S.paused){ S.timeLeftMs=remainingMsNow(); }
        persistResume();
      } else {
        requestWakeLock();
        if(!S.paused){
          const r=catchUpRunning();
          if(r.done || !(S.session&&S.session.steps[S.si])){ endSession(); return; }
          if(r.changed){ beginStep(true); }
          else { syncDeadlineFromRemaining(); paintTimerUI(S.session.steps[S.si]); }
          persistResume();
        }
      }
    });
  }
  beginStep(!!fromResume);
}
function beginStep(keepTime){
  const st=S.session.steps[S.si];
  if(!st){ endSession(); return; }
  if(!keepTime){
    S.timeLeftMs=Math.round((st.sec||0)*1000);
    S.lastWarnSec=null;
  } else {
    if(S.timeLeftMs==null||S.timeLeftMs<=0){
      if(S.timeLeft!=null&&S.timeLeft>0) S.timeLeftMs=Math.round(S.timeLeft*1000);
      else S.timeLeftMs=Math.round((st.sec||0)*1000);
    }
  }
  S.timeLeft=Math.max(0, Math.ceil(S.timeLeftMs/1000));
  syncDeadlineFromRemaining();
  paintStep();
  persistResume();
  clearPlayerTimers();
  let lastPersist=Date.now();
  S.tick=setInterval(()=>{
    if(!document.getElementById('player')){ clearPlayerTimers(); return; }
    if(S.paused) return;
    const changed=advanceRunningClock();
    if(changed==='done' || !(S.session&&S.session.steps[S.si])){
      clearPlayerTimers(); endSession(); return;
    }
    paintTimerUI(S.session.steps[S.si]||st);
    const now=Date.now();
    if(now-lastPersist>2000){ persistResume(); lastPersist=now; }
    if(changed){
      clearPlayerTimers();
      beginStep(false);
    }
  },200);
}
function demoTips(name){
  const ex=EX[name];

  return {lines:ex.how.slice(),watch:ex.watch||''};
}
function paintStep(){
  const s=S.session,st=s.steps[S.si],nx=s.steps[S.si+1],p=document.getElementById('player');
  if(!p||!st)return;
  clearRafs();

  const tipLines=tips.lines.length?tips.lines.concat(tips.watch?['Kill this fault: '+tips.watch]:[]):[st.c];
  let tipI=0;
  const showSec=Math.max(0, Math.ceil(remainingMsNow()/1000));
  p.className='player'+(st.kind==='rest'?' rest':'');
  p.innerHTML=`<div class="ptop"><span class="st" id="phase">${esc(st.phase)}</span><span class="st">${S.si+1} / ${s.steps.length}</span></div>

    <div class="pmid">

      ${st.kind==='work'&&tips.lines.length?`<div class="demotip" id="demotip"><span class="lab" id="demolab">Standard</span><div class="txt" id="demotxt">${esc(tipLines[0])}</div>
        <div class="howdots" id="howdots">${tipLines.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div></div>`:''}
      ${nx?`<p class="nextup">Next \u2192 ${esc(nx.n)}</p>`:'<p class="nextup">Last one</p>'}
    </div>
    <div class="pbot">
      <button class="btn ghost sm" id="pause" style="flex:1" aria-pressed="${S.paused?'true':'false'}">${S.paused?'Resume':'Pause'}</button>
      <button class="btn sm" id="skip" style="flex:1.6">${st.kind==='rest'?'Skip rest':'Done \u2192'}</button>
    </div>
    <details class="playermore">
      <summary>Session options</summary>
      <div class="moreacts">
        <button class="linkbtn" id="mute" type="button">${S.muted?'Unmute coach':'Mute coach'}</button>
        <button class="linkbtn" id="restart" type="button">Restart</button>
        <button class="linkbtn" id="quit" type="button">End session</button>
      </div>
    </details>`;
  announce('Step '+(S.si+1)+' of '+s.steps.length+'. '+st.phase+'. '+st.n+'.');
  coachStep(st);
  if(st.kind==='work'&&EX[st.n]){
    p.querySelector('#figslot').appendChild(exerciseImg(st.n,'hero'));
  }
  // Warm the next work poster while this interval runs.
  for(let i=S.si+1;i<s.steps.length;i++){
    const nx=s.steps[i];
    if(nx&&nx.kind==='work'&&EX[nx.n]){ prefetchExerciseMedia(nx.n); break; }
  }
  if(st.kind==='work'&&tipLines.length>1){
    S.tipTick=setInterval(()=>{
      if(S.paused)return;
      tipI=(tipI+1)%tipLines.length;
      const txt=document.getElementById('demotxt');

      if(dots)[...dots.children].forEach((d,i)=>d.className=i===tipI?'on':'');

async function endSession(){
  clearPlayerTimers(); clearRafs(); releaseWakeLock();
  const p=document.getElementById('player'); if(p)p.remove();
  const elapsed=Math.round(S.elapsedActiveMs||0);
  if(!S.slot){ clearResume(); S.screen='plan'; render(); return; }
  if(S.log[S.slot.i]){ clearResume(); S.screen='done'; render(); return; }
  if(!challengeLive()){
    clearResume();
    S.session=null; S.slot=null;
    S.screen='plan';
    render();
    coachCue('pre-kickoff','Workouts unlock at kickoff. Not credited.');
    return;
  }
  if(elapsed < MIN_COMPLETE_MS){
    // Partial — do not credit locally; keep no resume after confirmed end of player
    clearResume();
    S.partialInfo={elapsedMs:elapsed,minMs:MIN_COMPLETE_MS};
    S.screen='partial';
    render();
    coachCue('session-partial','Session ended early. Not credited.');
    return;
  }
  if(S.completing)return;
  S.completing=true;
  const pendingKey=S.slot.i;
  try{
    if(tracking()&&S.me){
      const res=await report('log',{elapsedMs:elapsed});
      if(res&&res.error==='pre_kickoff'){
        clearResume();
        S.session=null; S.slot=null;
        S.screen='plan';
        render();
        coachCue('pre-kickoff','Workouts unlock at kickoff. Not credited.');
        return;
      }
      if(res&&res.error==='incomplete'){
        S.partialInfo={elapsedMs:elapsed,minMs:MIN_COMPLETE_MS};
        S.screen='partial';
        render();
        coachCue('session-partial','Session ended early. Not credited.');
        return;
      }
      // duplicate or success — credit once locally
      S.log[pendingKey]={at:Date.now(),elapsedMs:elapsed};
      clearResume();
      save();
      S.screen='done';
      render();
      coachCue(res&&res.duplicate?'session-logged':'session-done',
        res&&res.duplicate?'Already logged. Keep elevating.':'Session complete. You elevated.');
    } else {
      S.log[pendingKey]={at:Date.now(),elapsedMs:elapsed};
      clearResume();
      save();
      S.screen='done';
      render();
      coachCue('session-done','Session complete. You elevated.');
    }
  }catch(e){
    // Network failed — queue already filled by report(); keep resume until verified
    persistResume();
    S.log[pendingKey]={at:Date.now(),elapsedMs:elapsed,pending:true};
    save();
    S.screen='done';
    render();
    coachCue('session-logged','Session saved locally. Syncing when online.');
  }finally{
    S.completing=false;
  }
}

  const total=sessionTotalSec(sess);
  a.appendChild(el(`<div class="sheet">${head('9-MINUTE CARD')}
    <p class="eyebrow">Exact structure · ${total}s = 9:00</p>
    <h2 class="display h-lg">Warm-up.<br>Circuit. Finish.</h2>
    <p class="fine" style="margin:12px 0 0">Level 1: 20s / 10s. Level 2+: 25s / 5s. Same nine minutes. Beginners use wall push-ups, chair squats, table rows.</p>
    <div class="phases">
      <div class="ph"><span class="k">Warm-up · 60s</span><span class="n">${esc(sess.steps[0].n)} + ${esc(sess.steps[1].n)}</span><span class="s">30s each</span></div>
      <div class="ph"><span class="k">Main · 6:00</span><span class="n">${sess.main.map(m=>m.n).join(' · ')}</span><span class="s">3 rounds · ${sess.work}s on / ${sess.rest}s rest</span></div>
      <div class="ph"><span class="k">Finisher · 60s</span><span class="n">${esc(sess.main[3].n)}</span><span class="s">Steady cadence</span></div>
      <div class="ph"><span class="k">Cool-down · 60s</span><span class="n">Two stretches</span><span class="s">30s each</span></div>
    </div>
    <p class="fine" style="margin-top:14px"><b>${CONFIG.PTS_PER_SESSION}</b> pts / session · <b>${CONFIG.PTS_PER_5PCT_CARD}</b> every 5% of card · <b>${CONFIG.PTS_PER_5PCT_WEIGHT}</b> every 5% bodyweight <b>lost</b> (gain = 0). Days 21–30 (Final ten days) step movements up one level.</p>
    <div class="note" style="margin-top:12px">Pain is a stop signal. Stop for sharp pain, chest pain, faintness, or severe shortness of breath. Not medical advice.</div>
    <div style="flex:1;min-height:20px"></div>
    <button class="btn accent" id="go" type="button">Start now</button>
    <button class="btn ghost" id="back" type="button" style="margin-top:8px">Back</button>
  </div>`));
  const go=document.getElementById('go');
  if(go){ go.textContent=primaryCtaLabel(); go.onclick=()=>{clearHash();S.screen='join';render()}; }
  document.getElementById('back').onclick=()=>{clearHash();S.screen=S.back||'cover';render()};
}
function privacyScreen(a){
  a.appendChild(el(`<div class="sheet">${head('PRIVACY')}
    <h2 class="display h-lg">What stays<br>visible.</h2>
    <p class="fine" style="margin:12px 0 0"><b>League boards (public):</b> display name (or callsign if none), league, sessions, streak, points, hours, and weight-loss percent if logged (never raw lbs).</p>
    <p class="fine"><b>Organizers:</b> callsign, display name, league, progress, phone and raw weights if entered in CRM, last active.</p>
    <p class="fine"><b>Card PIN:</b> 4–8 digits you set at lock-in (or later in Profile). The server stores a hash, never the PIN itself. Callsign + PIN restores your card on a PC or another phone. Do not share your PIN.</p>
    <p class="fine"><b>This device:</b> a copy of your card also stays in this browser so you can train offline.</p>
    <p class="fine"><b>Bodyweight:</b> optional. Scoring awards loss only (gain = 0). Public metric is loss percent; raw starting/current lbs stay private.</p>
    <p class="fine"><b>Retention:</b> roster data stays for the challenge until organizer or self-delete from Profile.</p>
    <p class="fine"><b>Callsign / leave:</b> update or delete from Profile.</p>
    <div style="flex:1;min-height:20px"></div>
    <button class="btn" id="back" type="button">Back</button>
  </div>`));
  document.getElementById('back').onclick=()=>{clearHash();S.screen=S.back||(S.profile?'plan':'cover');render()};
}
function settingsScreen(a){
  if(!S.me){S.screen='join';render();return}
  a.appendChild(el(`<div class="sheet">${head('PROFILE')}
    <h2 class="display h-lg">Callsign<br>& display name</h2>
    <div class="field"><label for="sn">Callsign (participant)</label>
      <input id="sn" maxlength="32" value="${esc(S.me.name||'')}" aria-describedby="snhint">
      <p class="hint" id="snhint">Organizers see this on the CRM.</p></div>
    <div class="field"><label for="sdn">Display name (public board)</label>
      <input id="sdn" maxlength="32" value="${esc(S.me.displayName||'')}" placeholder="Nickname on leaderboards" aria-describedby="sdnhint">
      <p class="hint" id="sdnhint">Shown on league boards. Leave blank to show your callsign.</p></div>
    <div class="leaguepick" id="lp">
      <button type="button" data-league="brothers" class="${S.me.league==='brothers'?'on':''}">Brothers</button>
      <button type="button" data-league="ladies" class="${S.me.league==='ladies'?'on':''}">Ladies</button>
    </div>
    <p class="fine" id="serr" style="min-height:16px"></p>
    <button class="btn accent" id="savep" type="button">Save profile</button>
    <div class="rule"></div>
    <p class="eyebrow">Card PIN</p>
    <p class="fine" style="margin:8px 0 0">Set a 4–8 digit PIN to open this same card on a PC or another phone. Required if you locked in before PINs existed.</p>
    <div class="field"><label for="curpin">Current PIN</label>
      <input id="curpin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" placeholder="Leave blank if you have not set one">
    </div>
    <div class="field"><label for="newpin">New PIN</label>
      <input id="newpin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" placeholder="4–8 digits">
    </div>
    <div class="field"><label for="newpin2">Confirm new PIN</label>
      <input id="newpin2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password">
      <p class="errline" id="pinseterr" role="alert"></p>
    </div>
    <button class="btn ghost" id="savepin" type="button">Save PIN</button>
    <button class="btn ghost" id="leave" type="button" style="margin-top:8px">Leave challenge / delete roster</button>
    <div style="text-align:center;margin-top:12px"><button class="linkbtn" id="back">Back to the card</button></div>
  </div>`));
  let league=S.me.league||'';
  document.getElementById('lp').onclick=e=>{
    const b=e.target.closest('button[data-league]'); if(!b)return;
    league=b.dataset.league;
    document.querySelectorAll('#lp button').forEach(x=>x.classList.toggle('on',x.dataset.league===league));
  };
  document.getElementById('savep').onclick=async()=>{
    const name=document.getElementById('sn').value.trim();
    const displayName=document.getElementById('sdn').value.trim();
    const err=document.getElementById('serr');
    if(name.length<2){err.textContent='Callsign must be at least 2 characters.';return}
    if(displayName && displayName.length<2){err.textContent='Display name must be 2–32 characters (or blank).';return}
    if(!league){err.textContent='Pick a league.';return}
    setMe(name,league,displayName); report('ping');
    if(tracking()){
      try{
        await fetch('/api/me/update',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({challenge:CONFIG.CHALLENGE,id:S.me.id,name,league,displayName})});
      }catch(e){}
    }
    err.style.color='var(--olive-soft)'; err.textContent='Saved. Board shows “'+boardNameOf(S.me)+'”.';
  };
  document.getElementById('savepin').onclick=async()=>{
    const err=document.getElementById('pinseterr');
    const np=pinDigits(document.getElementById('newpin').value);
    const np2=pinDigits(document.getElementById('newpin2').value);
    const cur=pinDigits(document.getElementById('curpin').value);
    err.style.color='';
    if(!/^\d{4,8}$/.test(np)){err.textContent='New PIN must be 4–8 digits.';return}
    if(np!==np2){err.textContent='PINs must match.';return}
    if(!tracking()){err.textContent='Roster tracking is off on this copy.';return}
    try{
      const r=await fetch('/api/me/pin',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({challenge:CONFIG.CHALLENGE,id:S.me.id,name:S.me.name,pin:np,currentPin:cur})});
      const d=await r.json();
      if(r.status===429){err.textContent='Too many tries. Wait and try again.';return}
      if(!d||!d.ok){
        err.textContent=d&&d.error==='bad pin'?'Current PIN rejected, or the new PIN is invalid.':'Could not save PIN. Confirm you are on the original card.';
        return;
      }
      S.me.hasPin=true; save();
      err.style.color='var(--olive-soft)'; err.textContent='PIN saved. Use callsign + PIN to log in on another device.';
      document.getElementById('newpin').value='';
      document.getElementById('newpin2').value='';
      document.getElementById('curpin').value='';
    }catch(e){err.textContent='Could not reach the roster.'}
  };
  document.getElementById('leave').onclick=async()=>{
    if(!confirm('Delete your roster entry for this challenge? Local card data on this device will also clear.'))return;
    if(tracking()){
      try{
        await fetch('/api/me/delete',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({challenge:CONFIG.CHALLENGE,id:S.me.id,name:S.me.name})});
      }catch(e){}
    }
    S.me=null;S.profile=null;S.log={};clearResume();save();S.screen='cover';render();
  };
  document.getElementById('back').onclick=()=>{clearHash();S.screen='plan';render()};
}

boot();

</script>
</body>
</html>
