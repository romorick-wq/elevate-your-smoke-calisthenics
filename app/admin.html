<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Elevate Your Smoke</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101412">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEAE4; --surface2:#FFFFFF; --ink:#101412;
  --muted:#5E6660; --line:rgba(16,20,18,.12); --accent:#E85D04; --accent-ink:#1A0F08;
  --olive:#2F3B2A; --olive-soft:#3F4F38; --danger:#C43C2C; --shadow:0 18px 50px rgba(16,20,18,.18);
  --disp:'Syne',system-ui,sans-serif; --body:'Outfit',system-ui,-apple-system,sans-serif;
  --radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;display:flex;justify-content:center;color:var(--ink);font-family:var(--body);
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(232,93,4,.28), transparent 55%),
    linear-gradient(165deg,#1a2218 0%, #2a3526 42%, #6d7464 100%);
}
#app{
  width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;
  display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.sheet{padding:0 20px 36px;flex:1;display:flex;flex-direction:column}
.masthead{
  margin:0 -20px 18px;padding:16px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;
  background:linear-gradient(135deg,var(--olive),var(--olive-soft));color:#F4F7EE;
}
.masthead h1{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.02em;margin:0;line-height:1}
.masthead .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-top:5px;display:block;font-weight:500}
.masthead .logout{
  flex:0 0 auto;border:1.5px solid rgba(244,247,238,.35);background:transparent;color:#F4F7EE;
  border-radius:999px;padding:8px 14px;font-family:var(--disp);font-weight:700;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
}
.masthead .logout:hover{border-color:#F4F7EE;background:rgba(244,247,238,.1)}
.masthead .logout[hidden]{display:none!important}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.display{font-family:var(--disp);font-weight:800;letter-spacing:-.03em;line-height:.95;margin:0}
.h-lg{font-size:34px}
.fine{font-size:12.5px;line-height:1.5;color:var(--muted)}
.rule{height:1px;background:var(--line);margin:16px 0}
.btn{
  display:block;width:100%;border:0;background:var(--ink);color:#F7F6F2;border-radius:999px;
  font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.04em;
  padding:15px 18px;cursor:pointer;
}
.btn:active{transform:scale(.98)}
.btn.sm{font-size:14px;padding:12px 16px}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.linkbtn{background:none;border:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  cursor:pointer;padding:8px 0;font-weight:600;text-decoration:none}
.linkbtn:hover{color:var(--ink)}
.statrow{display:flex;gap:8px;flex-wrap:wrap}
.statrow div{flex:1;min-width:72px;padding:14px 10px;text-align:center;background:var(--surface2);border-radius:var(--radius-sm)}
.statrow .n{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1}
.statrow .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.tabs{display:flex;gap:6px;margin:14px 0 4px}
.tabs button{
  flex:1;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:10px 8px;
  font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--muted);
}
.tabs button.on{background:var(--ink);color:#F7F6F2;border-color:var(--ink)}
.field{margin:14px 0 6px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;
  font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--ink);
  padding:4px 2px;-webkit-appearance:none;appearance:none}
.field select{font-size:18px;cursor:pointer}
.person{border-bottom:1px solid var(--line);padding:14px 0}
.person.cold{opacity:.7}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pn{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em}
.pd,.pm{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:500}
.pbar{height:6px;margin:8px 0 5px;background:rgba(16,20,18,.08);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--olive-soft);border-radius:99px}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 4px}
.metrics div{background:rgba(16,20,18,.05);border-radius:10px;padding:8px 6px;text-align:center}
.metrics .v{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1}
.metrics .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:600}
.metrics div.hi{background:rgba(232,93,4,.16);outline:1.5px solid var(--accent)}
.rank{font-family:var(--disp);font-weight:800;font-size:14px;color:var(--accent);flex:0 0 28px}
.note{border-left:3px solid var(--accent);padding:8px 0 8px 12px;margin:16px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
.err{color:var(--danger);margin-top:12px}
.okmsg{color:var(--olive-soft);margin-top:8px;font-size:12px;font-weight:600}
.trash{flex:0 0 auto;width:34px;height:34px;border:0;background:transparent;color:var(--danger);cursor:pointer;border-radius:8px;display:grid;place-items:center;padding:0}
.trash:hover{background:rgba(196,60,44,.1)}
.trash svg{width:18px;height:18px;display:block}
.pnwrap{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.meta .field{margin:0}
.meta .field.full{grid-column:1 / -1}
.meta .field label{margin-bottom:4px}
.meta .field input,.meta .field select{
  font-family:var(--body);font-weight:600;font-size:15px;letter-spacing:0;
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2);
}
.meta .field input:focus,.meta .field select:focus{outline:none;border-color:var(--accent)}
.meta .field select{cursor:pointer}
.save-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.save-row .btn{width:auto;flex:1;margin:0;min-width:88px}
.btn.reset{background:transparent;color:var(--danger);border:1.5px solid rgba(196,60,44,.45)}
.btn.reset:hover{background:rgba(196,60,44,.08)}
.btn.wa{background:#128C7E;color:#fff;border:0}
.find{display:flex;gap:8px;align-items:stretch;margin:14px 0 4px}
.find input{
  flex:1;font-family:var(--body);font-weight:600;font-size:15px;letter-spacing:0;
  border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface2);color:var(--ink);
}
.find input:focus{outline:none;border-color:var(--accent)}
.find .btn{width:auto;margin:0;flex:0 0 auto;padding:12px 18px}
.find-clear{background:none;border:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;font-weight:600;padding:4px 0}
.find-clear:hover{color:var(--ink)}
.appfoot{
  margin-top:28px;padding:18px 0 8px;text-align:center;
  font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600;
  border-top:1px solid var(--line);
}
.appfoot b{color:var(--ink);font-weight:700;letter-spacing:.04em}
.smsbox{margin-top:12px}
.smsbox textarea{
  width:100%;min-height:120px;resize:vertical;font-family:var(--body);font-weight:500;font-size:15px;
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2);color:var(--ink);
  line-height:1.45;
}
.smsbox textarea:focus{outline:none;border-color:var(--accent)}
.smsmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.smsmeta .chars{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.sms-actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sms-actions .btn{margin:0;text-align:center;text-decoration:none;box-sizing:border-box}
a.btn{display:block;cursor:pointer}
a.btn[aria-disabled="true"]{opacity:.45}
.sms-result{margin-top:12px;font-size:13px;line-height:1.45;color:var(--muted)}
.sms-result.ok{color:var(--olive-soft);font-weight:600}
.sms-result.bad{color:var(--danger);font-weight:600}
.btn.textme{background:transparent;color:var(--ink);border:1.5px solid var(--line);flex:1}
.btn.textme:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CONFIG={SYNC_URL:'/api',CHALLENGE:'smoke-30'};
const PIN_KEY='smoke30:admin-pin';
let PEOPLE=[];
let TAB='crm'; // crm | points | hours | weight | text
let LEAGUE='all'; // all | brothers | ladies
let QUERY='';
let SMS_TARGET=null; // null = blast, or {name, phone} for one person
let SMS_DRAFT='';
let SMS_TWILIO=false; // true when Railway has Twilio env
let SMS_MISSING=[];

const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API=()=>{
  try{const q=new URLSearchParams(location.search).get('api');if(q)return q}catch(e){}
  const u=(CONFIG.SYNC_URL||'').trim();
  if(!u)return '';
  if(u.startsWith('/')&&location.protocol==='file:')return '';
  return u;
};
const ago=ts=>{
  if(!ts)return 'never';
  const d=Math.floor((Date.now()-ts)/864e5);
  return d<=0?'today':d===1?'yesterday':d+' days ago';
};
const pinCode=()=>{try{return sessionStorage.getItem(PIN_KEY)||''}catch(e){return ''}};
const clearPin=()=>{try{sessionStorage.removeItem(PIN_KEY)}catch(e){}};
const fmtHrs=h=> (h==null||h==='')? '—' : (Number(h).toFixed(Number(h)>=10?1:2).replace(/\.?0+$/,'')+'h');
const fmtPct=p=>{
  if(p==null)return '—';
  const n=Number(p);
  return (n>0?'+':'')+n.toFixed(1)+'%';
};
const fmtLossPct=p=>{
  if(p==null)return '—';
  const n=Number(p);
  if(!Number.isFinite(n))return '—';
  if(n>0) return n.toFixed(1)+'% lost';
  if(n<0) return Math.abs(n).toFixed(1)+'% gained';
  return 'No change';
};
function sessionsProgressLabel(done,total,perWeek){
  const t=Number(total)||0;
  const d=Number(done)||0;
  if(t>0) return d+' of '+t+' sessions';
  const WEEK={3:13,4:18,5:22,6:26}; // 30-day card targets by freq
  const derived=WEEK[Number(perWeek)]||0;
  if(derived>0) return d+' of '+derived+' sessions';
  return 'Schedule unavailable';
}

function logout(){
  clearPin();
  PEOPLE=[];
  TAB='crm';
  LEAGUE='all';
  QUERY='';
  render();
}

function setLoggedInChrome(on){
  const title=document.getElementById('admintitle');
  const blurb=document.getElementById('adminblurb');
  const gate=document.getElementById('gate');
  const out=document.getElementById('logout');
  if(title) title.innerHTML=on?'Roster<br>CRM':'Admin<br>login';
  if(blurb) blurb.hidden=!!on;
  if(gate) gate.hidden=!!on;
  if(out) out.hidden=!on;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  app.appendChild(el(`<div class="sheet">
    <div class="masthead">
      <div class="brand"><h1>Elevate Your Smoke</h1><span class="sub">Admin CRM</span></div>
      <button type="button" class="logout" id="logout" hidden>Log out</button>
    </div>
    <p class="eyebrow">Roster \u00b7 ${esc(CONFIG.CHALLENGE)}</p>
    <h2 class="display h-lg" id="admintitle">Admin<br>login</h2>
    <p class="fine" id="adminblurb" style="margin:12px 0 0">Organizer CRM — Brothers / Ladies leagues, phone, weights, hours, and points. 100 pts per 5% bodyweight lost. 50 pts per 5% of the card completed. 10 pts per session.</p>
    <div class="rule"></div>
    <div id="gate"></div>
    <div id="body"></div>
    <div style="flex:1;min-height:24px"></div>
    <div style="text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px">
      <a class="linkbtn" href="/app">Back to the workout</a>
      <button type="button" class="linkbtn" id="logout2" hidden>Log out</button>
    </div>
    <p class="appfoot" style="margin-top:18px;border:0;padding-top:0">Made by <b>Cigar Society Dev. Team</b> · v1.1.0</p>
  </div>`));

  document.getElementById('logout').onclick=logout;
  document.getElementById('logout2').onclick=logout;

  const gate=document.getElementById('gate');
  const body=document.getElementById('body');
  if(!API()){
    gate.appendChild(el('<div class="note">No roster API is configured on this copy.</div>'));
    return;
  }

  gate.appendChild(el(`<div id="loginform">
    <div class="field"><label for="pin">Organizer code</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus></div>
    <button class="btn accent" id="load" style="margin-top:14px">Log in</button>
    <p class="fine err" id="err" hidden></p>
  </div>`));

  const pin=document.getElementById('pin');
  const err=document.getElementById('err');
  try{const saved=sessionStorage.getItem(PIN_KEY);if(saved)pin.value=saved}catch(e){}

  const load=async()=>{
    const code=pin.value.trim();
    err.hidden=true;
    if(!code){err.textContent='Enter your organizer code.';err.hidden=false;pin.focus();return}
    body.innerHTML='<p class="fine" style="margin-top:16px">Loading\u2026</p>';
    try{
      const u=API()+(API().includes('?')?'&':'?')+'action=roster&challenge='+
        encodeURIComponent(CONFIG.CHALLENGE)+'&pin='+encodeURIComponent(code);
      const r=await fetch(u,{redirect:'follow'});
      const d=await r.json();
      if(!d.ok){
        body.innerHTML='';
        setLoggedInChrome(false);
        err.textContent=d.error==='bad pin'?'That code did not match.':'Could not read the roster.';
        err.hidden=false;
        return;
      }
      try{sessionStorage.setItem(PIN_KEY,code)}catch(e){}
      PEOPLE=d.people||[];
      await refreshSmsMode();
      setLoggedInChrome(true);
      document.getElementById('logout2').hidden=false;
      try{
        renderDashboard(body);
      }catch(renderErr){
        console.error(renderErr);
        body.innerHTML='';
        setLoggedInChrome(false);
        document.getElementById('logout2').hidden=true;
        err.textContent='Roster loaded but the admin screen failed to render. Refresh and try again.';
        err.hidden=false;
      }
    }catch(e){
      console.error(e);
      body.innerHTML='';
      setLoggedInChrome(false);
      document.getElementById('logout2').hidden=true;
      err.textContent='Could not reach the roster. Try again in a moment.';
      err.hidden=false;
    }
  };

  document.getElementById('load').onclick=load;
  pin.onkeydown=e=>{if(e.key==='Enter')load()};
  if(pin.value)load();
}

function leagueLabel(v){
  if(v==='brothers')return 'Brothers';
  if(v==='ladies')return 'Ladies';
  return 'Unassigned';
}
function matchPerson(p, q){
  if(!q)return true;
  const hay=[p.name,p.displayName,p.phone,p.dateStarted,p.league,leagueLabel(p.league),String(p.startingWeight??''),String(p.currentWeight??'')]
    .join(' ').toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(tok=>hay.includes(tok));
}
function filteredPeople(){
  let list=PEOPLE.slice();
  if(LEAGUE==='brothers'||LEAGUE==='ladies') list=list.filter(p=>(p.league||'')===LEAGUE);
  const q=String(QUERY||'').trim().toLowerCase();
  if(!q)return list;
  return list.filter(p=>matchPerson(p,q));
}

function renderDashboard(body){
  body.innerHTML='';
  const all=PEOPLE;
  if(!all.length){
    body.appendChild(el(`<div style="margin-top:8px">
      <p class="fine">Nobody has joined yet. Share the app link and have them lock a callsign.</p>
      <button type="button" class="btn ghost sm" id="reload" style="margin-top:14px">Refresh roster</button>
    </div>`));
    const reload=document.getElementById('reload');
    if(reload) reload.onclick=async()=>{
      const code=pinCode();
      if(!code){logout();return}
      body.innerHTML='<p class="fine" style="margin-top:16px">Loading\u2026</p>';
      try{
        const u=API()+(API().includes('?')?'&':'?')+'action=roster&challenge='+
          encodeURIComponent(CONFIG.CHALLENGE)+'&pin='+encodeURIComponent(code);
        const r=await fetch(u,{redirect:'follow'});
        const d=await r.json();
        if(!d.ok){logout();return}
        PEOPLE=d.people||[];
        renderDashboard(body);
      }catch(e){
        body.innerHTML='<p class="fine err" style="margin-top:16px">Could not reach the roster.</p>';
      }
    };
    return;
  }
  const people=filteredPeople();
  const wk=Date.now()-7*864e5;
  const active=all.filter(p=>p.lastActive>wk).length;
  const done=all.filter(p=>p.total&&p.sessions>=p.total).length;
  const totalHrs=all.reduce((s,p)=>s+(p.hours||0),0);
  const totalPts=all.reduce((s,p)=>s+(p.points||0),0);
  body.appendChild(el(`<div class="statrow" style="margin-top:16px">
    <div><div class="n">${all.length}</div><div class="l">On roster</div></div>
    <div><div class="n">${active}</div><div class="l">Active 7d</div></div>
    <div><div class="n">${done}</div><div class="l">Finished</div></div>
    <div><div class="n">${fmtHrs(totalHrs)}</div><div class="l">Hours</div></div>
    <div><div class="n">${totalPts}</div><div class="l">Points</div></div>
  </div>`));

  body.appendChild(el(`<div class="findwrap">
    <p class="eyebrow" style="margin-top:18px">Find participant</p>
    <div class="find">
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Name or phone…" value="${esc(QUERY)}">
      <button type="button" class="btn accent sm" id="find">Find</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:20px">
      <p class="fine" id="findmeta" style="margin:0"></p>
      <button type="button" class="find-clear" id="clearq" ${QUERY?'':'hidden'}>Clear</button>
    </div>
  </div>`));

  const qInput=document.getElementById('q');
  const findMeta=document.getElementById('findmeta');
  const runFind=()=>{
    QUERY=qInput.value.trim();
    document.getElementById('clearq').hidden=!QUERY;
    renderDashboard(body);
    const again=document.getElementById('q');
    if(again){again.focus();const n=again.value.length;again.setSelectionRange(n,n)}
  };
  document.getElementById('find').onclick=runFind;
  qInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();runFind()}};
  qInput.oninput=()=>{
    // live filter as they type
    QUERY=qInput.value;
    document.getElementById('clearq').hidden=!String(QUERY).trim();
    const list=document.getElementById('list');
    if(!list)return;
    const matched=filteredPeople();
    findMeta.textContent=QUERY.trim()
      ? (matched.length? matched.length+' match'+(matched.length===1?'':'es') : 'No matches')
      : '';
    if(TAB==='text') renderText(list, matched);
    else if(TAB==='crm') renderCrm(list, matched);
    else renderBoard(list, matched, TAB);
  };
  document.getElementById('clearq').onclick=()=>{
    QUERY='';
    renderDashboard(body);
  };
  findMeta.textContent=QUERY.trim()
    ? (people.length? people.length+' match'+(people.length===1?'':'es')+' of '+all.length : 'No matches for “'+QUERY.trim()+'”')
    : '';

  body.appendChild(el(`<div>
    <p class="eyebrow" style="margin-top:16px">League</p>
    <div class="tabs" id="leagues">
      <button type="button" data-league="all" class="${LEAGUE==='all'?'on':''}">All</button>
      <button type="button" data-league="brothers" class="${LEAGUE==='brothers'?'on':''}">Brothers</button>
      <button type="button" data-league="ladies" class="${LEAGUE==='ladies'?'on':''}">Ladies</button>
    </div>
    <p class="eyebrow" style="margin-top:14px">Sort / view</p>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="crm" class="${TAB==='crm'?'on':''}">CRM</button>
      <button type="button" data-tab="text" class="${TAB==='text'?'on':''}">Text</button>
      <button type="button" data-tab="points" class="${TAB==='points'?'on':''}">Points</button>
      <button type="button" data-tab="hours" class="${TAB==='hours'?'on':''}">Hours</button>
      <button type="button" data-tab="weight" class="${TAB==='weight'?'on':''}">Weight</button>
    </div>
  </div>`));
  body.querySelectorAll('#leagues button').forEach(b=>{
    b.onclick=()=>{LEAGUE=b.dataset.league;renderDashboard(body)};
  });
  body.querySelectorAll('#tabs button').forEach(b=>{
    b.onclick=()=>{
      TAB=b.dataset.tab;
      if(TAB!=='text') SMS_TARGET=null;
      renderDashboard(body);
    };
  });

  const list=el('<div id="list"></div>');
  body.appendChild(list);
  if(TAB==='text'){
    renderText(list, people);
  }else if(!people.length){
    list.appendChild(el(`<p class="fine" style="margin-top:12px">${QUERY.trim()
      ? 'No participants match “'+esc(QUERY.trim())+'”. Clear search to see the full roster.'
      : 'No one in this league filter yet.'}</p>`));
  }else if(TAB==='crm') renderCrm(list, people);
  else renderBoard(list, people, TAB);

  body.appendChild(el('<p class="fine" style="margin-top:14px">Filter by Brothers / Ladies, then Find by callsign, display name, or phone. Text tab blasts or singles out anyone with a phone on file. CRM shows the real callsign; set a Display name for what appears on public boards. <b>Reset</b> clears sessions, BW change, and start date but keeps them on the roster. Trash removes them entirely.</p>'));
}

function hasPhone(p){
  return !!(p&&String(p.phone||'').replace(/\D/g,'').length>=10);
}
function phoneCount(people){
  return (people||[]).filter(hasPhone).length;
}
function normalizePhoneClient(raw){
  const digits=String(raw||'').replace(/\D/g,'');
  if(!digits)return '';
  if(digits.length===10)return '+1'+digits;
  if(digits.length===11&&digits.startsWith('1'))return '+'+digits;
  if(String(raw||'').trim().startsWith('+')&&digits.length>=10&&digits.length<=15)return '+'+digits;
  return '';
}
/** Normalize a list of raw phones to E.164-ish numbers. */
function normalizePhoneList(phones){
  const nums=[];
  const seen=new Set();
  (phones||[]).forEach(raw=>{
    const n=normalizePhoneClient(raw);
    if(!n||seen.has(n))return;
    seen.add(n);
    nums.push(n);
  });
  return nums;
}
/** Build a Messages deep-link that works on iPhone / Mac / Android. */
function buildSmsUri(phones, body){
  const nums=normalizePhoneList(phones);
  if(!nums.length)return '';
  const enc=encodeURIComponent(String(body||''));
  const ua=navigator.userAgent||'';
  const apple=/iPhone|iPad|Macintosh|Mac OS X/i.test(ua);
  const android=/Android/i.test(ua);
  if(nums.length===1){
    // Single recipient — most reliable across platforms
    if(android) return 'sms:'+nums[0]+'?body='+enc;
    // iOS / Mac Messages: sms:number&body= works; sms:number?body= also ok on newer iOS
    return 'sms:'+nums[0]+'&body='+enc;
  }
  const addrs=nums.map(n=>n.replace(/^\+/,'')).join(',');
  if(apple) return 'sms:/open?addresses='+addrs+'&body='+enc;
  if(android) return 'sms:'+addrs+'?body='+enc;
  return 'sms:'+addrs+'?body='+enc;
}
/** WhatsApp click-to-chat (one person per link). Digits only, no +. */
function buildWhatsAppUri(phone, body){
  const n=normalizePhoneClient(phone);
  if(!n)return '';
  const digits=n.replace(/\D/g,'');
  if(digits.length<10)return '';
  return 'https://wa.me/'+digits+'?text='+encodeURIComponent(String(body||''));
}
/** Open Messages. Prefer sync navigation from a real click (no confirm() beforehand). */
function openDeviceSms(phones, body){
  const uri=buildSmsUri(phones, body);
  if(!uri)return false;
  try{
    // location.assign keeps user-activation better than a programmatic <a>.click()
    window.location.assign(uri);
    return true;
  }catch(e){
    try{
      const a=document.createElement('a');
      a.href=uri;
      a.rel='noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
      return true;
    }catch(e2){ return false; }
  }
}
/** Open WhatsApp for one number (new tab / app). */
function openWhatsApp(phone, body){
  const uri=buildWhatsAppUri(phone, body);
  if(!uri)return false;
  try{
    const w=window.open(uri,'_blank','noopener');
    if(!w){
      // Popup blocked — navigate this tab
      window.location.assign(uri);
    }
    return true;
  }catch(e){
    try{ window.location.assign(uri); return true; }catch(e2){ return false; }
  }
}
async function copySmsBundle(phones, body){
  const nums=[];
  const seen=new Set();
  (phones||[]).forEach(raw=>{
    const n=normalizePhoneClient(raw);
    if(!n||seen.has(n))return;
    seen.add(n);
    nums.push(n);
  });
  const text='To: '+nums.join(', ')+'\n\n'+String(body||'').trim();
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy'); ta.remove();
    return ok;
  }catch(e){ return false; }
}

async function refreshSmsMode(){
  try{
    const r=await fetch('/api/health',{cache:'no-store'});
    const d=await r.json();
    SMS_TWILIO=!!(d&&d.sms);
    SMS_MISSING=(d&&d.smsStatus&&d.smsStatus.missing)||[];
  }catch(e){SMS_TWILIO=false;SMS_MISSING=[]}
}

async function postSms(payload){
  const r=await fetch('/api/roster/sms',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  return r.json();
}

function renderText(list, people){
  list.innerHTML='';
  const pin=pinCode();
  const withPhone=phoneCount(people);
  const allPhone=phoneCount(PEOPLE);
  const solo=SMS_TARGET;
  const scopeLab=solo
    ? ('Texting '+solo.name+(solo.phone?' · '+solo.phone:''))
    : (LEAGUE==='brothers'?'Brothers of the League'
      :LEAGUE==='ladies'?'Ladies of the League'
      :QUERY.trim()?'Current Find results'
      :'Full roster');
  const targetN=solo?1:withPhone;
  const modeLab=SMS_TWILIO
    ? 'Free path: Messages or WhatsApp on your phone. Optional Twilio SMS send is also enabled on this deploy.'
    : 'Free messaging — Messages or WhatsApp. You review the chat, then tap Send. No paid API required.';
  if(!String(SMS_DRAFT||'').trim()){
    SMS_DRAFT='Elevate Your Smoke — reminder from The Cigar Society.';
  }
  const CHUNK=12;

  list.appendChild(el(`<div class="smsbox">
    <p class="eyebrow" style="margin-top:12px">Group text \u00b7 SMS & WhatsApp</p>
    <p class="fine" style="margin:0 0 10px">${solo
      ? 'Individual message. Clear the target below to blast the filtered roster instead.'
      : 'Message goes to everyone in <b>'+esc(scopeLab)+'</b> who has a phone on file ('+withPhone+' of '+(people.length||0)+' shown'+(LEAGUE!=='all'||QUERY.trim()?' · '+allPhone+' on full roster':'')+').'}</p>
    <p class="fine" style="margin:0 0 10px;color:var(--ink)">${esc(modeLab)}</p>
    ${solo?`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
      <p class="fine" style="margin:0;color:var(--ink);font-weight:600">${esc(scopeLab)}</p>
      <button type="button" class="find-clear" id="cleartarget">Clear target</button>
    </div>`:''}
    <label class="eyebrow" for="smsmsg" style="display:block">Message</label>
    <textarea id="smsmsg" maxlength="1500" placeholder="Society update — kickoff reminder, schedule change, keep elevating…">${esc(SMS_DRAFT)}</textarea>
    <div class="smsmeta">
      <span class="chars" id="smschars">${(SMS_DRAFT||'').length} / 1500</span>
      <span class="fine" style="margin:0" id="smsreclabel">${solo?'1 recipient':targetN+' recipients'}</span>
    </div>
    <div class="sms-actions">
      <a class="btn accent" id="smssend" href="#">${solo?'Open Messages (free)':'Open Messages · '+targetN+' (free)'}</a>
      <a class="btn accent" id="wasend" href="#" style="background:#128C7E;color:#fff">${solo?'Open WhatsApp (free)':'Open WhatsApp · '+targetN+' (free)'}</a>
      <button type="button" class="btn ghost sm" id="smscopy">Copy numbers + message</button>
      ${SMS_TWILIO?`<button type="button" class="btn ghost sm" id="smstwilio">${solo?'Send via Twilio SMS':'Send via Twilio SMS · '+targetN}</button>`:''}
      ${!solo?`<a class="btn ghost sm" id="smsall" href="#">Open Messages · all roster (${allPhone})</a>`:''}
      ${!solo?`<a class="btn ghost sm" id="waall" href="#">Open WhatsApp · all roster (${allPhone})</a>`:''}
      <button type="button" class="btn ghost sm" id="smsnext" hidden>Open next</button>
    </div>
    <p class="sms-result" id="smsresult" hidden></p>
    <p class="fine" style="margin-top:12px">Save phones on CRM cards first (WhatsApp needs the same mobile number). <b>Messages</b> can group; <b>WhatsApp</b> opens one chat at a time — use Open next for the rest. No Meta Business API required.</p>
  </div>`));

  const ta=document.getElementById('smsmsg');
  const chars=document.getElementById('smschars');
  const result=document.getElementById('smsresult');
  const sendA=document.getElementById('smssend');
  const waA=document.getElementById('wasend');
  const allA=document.getElementById('smsall');
  const waAllA=document.getElementById('waall');
  const nextBtn=document.getElementById('smsnext');
  let batchState=null; // {channel:'sms'|'wa', phones, message, i, chunk}

  const showResult=(ok, text)=>{
    result.hidden=false;
    result.className='sms-result '+(ok?'ok':'bad');
    result.textContent=text;
  };

  const recipientsFor=(mode)=>{
    if(solo) return [{name:solo.name,phone:solo.phone}];
    if(mode==='all') return PEOPLE.filter(hasPhone).map(p=>({name:p.name,phone:p.phone}));
    return people.filter(hasPhone).map(p=>({name:p.name,phone:p.phone}));
  };

  const syncSmsLink=(anchor, mode)=>{
    if(!anchor)return;
    const message=ta.value.trim();
    const phones=recipientsFor(mode).map(r=>r.phone);
    const uri=(message&&phones.length)?buildSmsUri(phones.slice(0,CHUNK), message):'';
    if(uri){
      anchor.href=uri;
      anchor.removeAttribute('aria-disabled');
    }else{
      anchor.href='#';
      anchor.setAttribute('aria-disabled','true');
    }
  };
  const syncWaLink=(anchor, mode)=>{
    if(!anchor)return;
    const message=ta.value.trim();
    const phones=normalizePhoneList(recipientsFor(mode).map(r=>r.phone));
    const uri=(message&&phones.length)?buildWhatsAppUri(phones[0], message):'';
    if(uri){
      anchor.href=uri;
      anchor.target='_blank';
      anchor.rel='noopener';
      anchor.removeAttribute('aria-disabled');
    }else{
      anchor.href='#';
      anchor.removeAttribute('target');
      anchor.setAttribute('aria-disabled','true');
    }
  };

  const syncAll=()=>{
    SMS_DRAFT=ta.value;
    chars.textContent=ta.value.length+' / 1500';
    syncSmsLink(sendA, solo?'one':'filter');
    syncSmsLink(allA, 'all');
    syncWaLink(waA, solo?'one':'filter');
    syncWaLink(waAllA, 'all');
  };
  ta.oninput=syncAll;
  syncAll();

  const clearT=document.getElementById('cleartarget');
  if(clearT) clearT.onclick=()=>{SMS_TARGET=null;renderText(list, people)};

  const onOpenSms=(e, mode)=>{
    const message=ta.value.trim();
    if(!message){
      e.preventDefault();
      showResult(false,'Type a message first.');
      ta.focus();
      return;
    }
    const phones=recipientsFor(mode).map(r=>r.phone);
    if(!phones.length){
      e.preventDefault();
      showResult(false,'Nobody in that set has a phone yet. Add phones on CRM cards.');
      return;
    }
    const usable=normalizePhoneList(phones);
    if(!usable.length){
      e.preventDefault();
      showResult(false,'Phone numbers look invalid. Use +1 and 10 digits, then Save on CRM.');
      return;
    }
    if(usable.length>CHUNK){
      batchState={channel:'sms', phones:usable, message, i:0, chunk:CHUNK};
      const slice=usable.slice(0, CHUNK);
      const uri=buildSmsUri(slice, message);
      if(!uri){
        e.preventDefault();
        showResult(false,'Could not build Messages link. Use Copy instead.');
        return;
      }
      batchState.i=slice.length;
      e.currentTarget.href=uri;
      nextBtn.hidden=false;
      nextBtn.textContent='Open next Messages batch ('+batchState.i+' of '+usable.length+' done)';
      showResult(true,'Opening first Messages batch · '+batchState.i+' of '+usable.length+'. Tap Send, then Open next.');
      return;
    }
    const uri=buildSmsUri(usable, message);
    if(!uri){
      e.preventDefault();
      showResult(false,'Could not open Messages. Use Copy numbers + message instead.');
      return;
    }
    e.currentTarget.href=uri;
    showResult(true,'Opening Messages with '+usable.length+' recipient'+(usable.length===1?'':'s')+'. Tap Send. If nothing opens, use Copy or WhatsApp.');
  };

  const onOpenWa=(e, mode)=>{
    const message=ta.value.trim();
    if(!message){
      e.preventDefault();
      showResult(false,'Type a message first.');
      ta.focus();
      return;
    }
    const phones=recipientsFor(mode).map(r=>r.phone);
    if(!phones.length){
      e.preventDefault();
      showResult(false,'Nobody in that set has a phone yet. Add phones on CRM cards.');
      return;
    }
    const usable=normalizePhoneList(phones);
    if(!usable.length){
      e.preventDefault();
      showResult(false,'Phone numbers look invalid. Use +1 and 10 digits, then Save on CRM.');
      return;
    }
    // WhatsApp: one chat per click
    batchState={channel:'wa', phones:usable, message, i:0, chunk:1};
    const uri=buildWhatsAppUri(usable[0], message);
    if(!uri){
      e.preventDefault();
      showResult(false,'Could not build WhatsApp link. Check the number format.');
      return;
    }
    batchState.i=1;
    e.currentTarget.href=uri;
    e.currentTarget.target='_blank';
    e.currentTarget.rel='noopener';
    if(usable.length>1){
      nextBtn.hidden=false;
      nextBtn.textContent='Open next WhatsApp ('+batchState.i+' of '+usable.length+' done)';
      showResult(true,'Opening WhatsApp for the first number · '+batchState.i+' of '+usable.length+'. Send, then Open next.');
    }else{
      nextBtn.hidden=true;
      batchState=null;
      showResult(true,'Opening WhatsApp. Review the chat, then tap Send.');
    }
  };

  sendA.addEventListener('click', e=>onOpenSms(e, solo?'one':'filter'));
  if(allA) allA.addEventListener('click', e=>onOpenSms(e, 'all'));
  waA.addEventListener('click', e=>onOpenWa(e, solo?'one':'filter'));
  if(waAllA) waAllA.addEventListener('click', e=>onOpenWa(e, 'all'));

  nextBtn.onclick=e=>{
    e.preventDefault();
    if(!batchState){nextBtn.hidden=true;return}
    if(batchState.channel==='wa'){
      const phone=batchState.phones[batchState.i];
      if(!phone){nextBtn.hidden=true;batchState=null;return}
      if(openWhatsApp(phone, batchState.message)){
        batchState.i+=1;
        if(batchState.i>=batchState.phones.length){
          nextBtn.hidden=true;
          showResult(true,'Opened WhatsApp for all '+batchState.phones.length+'. Tap Send in each chat.');
          batchState=null;
        }else{
          nextBtn.textContent='Open next WhatsApp ('+batchState.i+' of '+batchState.phones.length+' done)';
          showResult(true,'Opened next WhatsApp · '+batchState.i+' of '+batchState.phones.length+'.');
        }
      }else{
        showResult(false,'Could not open WhatsApp. Allow pop-ups, or use Copy.');
      }
      return;
    }
    const slice=batchState.phones.slice(batchState.i, batchState.i+batchState.chunk);
    if(!slice.length){nextBtn.hidden=true;batchState=null;return}
    if(openDeviceSms(slice, batchState.message)){
      batchState.i+=slice.length;
      if(batchState.i>=batchState.phones.length){
        nextBtn.hidden=true;
        showResult(true,'Opened Messages for all '+batchState.phones.length+'. Tap Send in each thread.');
        batchState=null;
      }else{
        nextBtn.textContent='Open next Messages batch ('+batchState.i+' of '+batchState.phones.length+' done)';
        showResult(true,'Opened next Messages batch · '+batchState.i+' of '+batchState.phones.length+'.');
      }
    }else{
      showResult(false,'Could not open Messages. Use Copy or WhatsApp instead.');
    }
  };

  const runCopy=async(mode)=>{
    const message=ta.value.trim();
    if(!message){showResult(false,'Type a message first.');ta.focus();return}
    const phones=recipientsFor(mode).map(r=>r.phone);
    if(!phones.length){showResult(false,'Nobody in that set has a phone yet.');return}
    const ok=await copySmsBundle(phones, message);
    const n=normalizePhoneList(phones).length;
    showResult(ok, ok
      ? ('Copied '+n+' number'+(n===1?'':'s')+' and your message. Paste into Messages or WhatsApp.')
      : 'Could not copy. Select the message manually.');
  };

  const runTwilio=async(mode)=>{
    const message=ta.value.trim();
    if(!message){showResult(false,'Type a message first.');ta.focus();return}
    if(!pin){showResult(false,'Session expired. Log in again.');return}
    let confirmMsg='';
    let payload={pin,challenge:CONFIG.CHALLENGE,message};
    if(solo){
      confirmMsg='Text '+solo.name+' via Twilio SMS now?';
      payload.people=[{name:solo.name,phone:solo.phone}];
    }else if(mode==='all'){
      if(!allPhone){showResult(false,'Nobody on the full roster has a phone yet.');return}
      confirmMsg='Text all '+allPhone+' roster phones via Twilio SMS?';
    }else{
      if(!withPhone){showResult(false,'Nobody in this filter has a phone yet.');return}
      confirmMsg='Text '+withPhone+' people in '+scopeLab+' via Twilio SMS?';
      payload.people=people.filter(hasPhone).map(p=>({name:p.name,phone:p.phone}));
    }
    if(!confirm(confirmMsg))return;
    const btn=document.getElementById('smstwilio');
    if(btn){btn.disabled=true;btn.textContent='Sending…'}
    result.hidden=true;
    try{
      const d=await postSms(payload);
      if(d.error==='sms not configured'){
        SMS_TWILIO=false;
        SMS_MISSING=d.missing||[];
        showResult(false,'Twilio not configured'+(SMS_MISSING.length?': missing '+SMS_MISSING.join(', '):'')+'. Use Messages, WhatsApp, or Copy.');
        renderText(list, people);
      }else if(d.error==='bad pin'){
        showResult(false,'Organizer code rejected. Log out and back in.');
      }else if(d.error==='no phones'){
        showResult(false,'No usable phone numbers in that set.');
      }else if(d.error==='empty message'){
        showResult(false,'Type a message first.');
      }else{
        const s=(d.meta&&d.meta.sent)||(d.sent&&d.sent.length)||0;
        const f=(d.meta&&d.meta.failed)||(d.failed&&d.failed.length)||0;
        const k=(d.meta&&d.meta.skipped)||(d.skipped&&d.skipped.length)||0;
        if(f===0&&s>0) showResult(true,'Sent '+s+' text'+(s===1?'':'s')+(k?' · skipped '+k:'')+'.');
        else if(s>0) showResult(false,'Sent '+s+', failed '+f+(k?' · skipped '+k:'')+'. Check numbers and Twilio.');
        else showResult(false,d.error||('Failed'+(f?' ('+f+')':'')+'.'));
      }
    }catch(e){
      showResult(false,'Could not reach the SMS API.');
    }
    if(btn){btn.disabled=false;btn.textContent=solo?'Send via Twilio SMS':'Send via Twilio SMS · '+targetN}
  };

  document.getElementById('smscopy').onclick=()=>runCopy(solo?'one':'filter');
  const tw=document.getElementById('smstwilio');
  if(tw) tw.onclick=()=>runTwilio(solo?'one':'filter');
}

function sortBoard(people, mode){
  const arr=people.slice();
  if(mode==='hours') arr.sort((a,b)=>(Number(b.hours)||0)-(Number(a.hours)||0)||(Number(b.points)||0)-(Number(a.points)||0));
  else if(mode==='weight') arr.sort((a,b)=>{
    const aw=a.weightLostPct==null?-1e9:Number(a.weightLostPct);
    const bw=b.weightLostPct==null?-1e9:Number(b.weightLostPct);
    return bw-aw||(Number(b.points)||0)-(Number(a.points)||0);
  });
  else arr.sort((a,b)=>(Number(b.points)||0)-(Number(a.points)||0)||(Number(b.hours)||0)-(Number(a.hours)||0));
  return arr;
}

        <span class="pd"><b style="font-family:var(--disp);font-size:18px;color:var(--ink)">${esc(pri)}</b><br>${esc(priLab)} · ${esc(leagueLabel(p.league))} · ${esc(ago(p.lastActive))}</span>

        <div class="${mode==='points'?'hi':''}"><div class="v">${p.points||0}</div><div class="k">Points</div></div>
        <div class="${mode==='hours'?'hi':''}"><div class="v">${fmtHrs(p.hours)}</div><div class="k">Hours</div></div>
        <div class="${mode==='weight'?'hi':''}"><div class="v">${esc(wLabel)}</div><div class="k">Weight</div></div>
      </div>
      <div class="prow"><span class="pm">${p.sessions||0}/${p.total||0} sessions \u00b7 streak ${p.streak||0}</span>
        <span class="pm">${p.weightMilestones||0} wt · ${p.hoursMilestones||0} hr milestones</span></div>

    list.appendChild(row);

function renderCrm(list, people){
  list.innerHTML='';
  list.appendChild(el('<p class="eyebrow" style="margin-top:12px">Participant CRM · most recent first</p>'));
  const trashIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
  const pin=pinCode();
  const wk=Date.now()-7*864e5;
  const body=document.getElementById('body');

  people.slice().sort((a,b)=>(b.lastActive||0)-(a.lastActive||0)).forEach((p,idx)=>{
    const pct=p.total?Math.round(100*p.sessions/p.total):0;
    const cold=p.lastActive<wk;
    const startVal=p.startingWeight===''||p.startingWeight==null?'':p.startingWeight;
    const curVal=p.currentWeight===''||p.currentWeight==null?'':p.currentWeight;
    const startedVal=p.dateStarted||'';
    const phoneVal=p.phone||'';
    const displayVal=p.displayName||'';
    const leagueVal=p.league==='ladies'?'ladies':p.league==='brothers'?'brothers':'';
    const uid='p'+idx;
    const wLabel=p.weightLostPct==null?'—':fmtLossPct(p.weightLostPct);
    const boardShows=displayVal||p.name||'—';
    const row=el(`<div class="person${cold?' cold':''}">
      <div class="prow"><span class="pnwrap"><span class="pn">${esc(p.name||'\u2014')}</span>
        <button type="button" class="trash" title="Remove from roster" aria-label="Remove ${esc(p.name||'participant')}">${trashIcon}</button></span>
        <span class="pd">${esc(leagueLabel(p.league))} · ${esc(ago(p.lastActive))}</span></div>
      <p class="fine" style="margin:6px 0 0">Board shows: <b style="color:var(--ink)">${esc(boardShows)}</b>${displayVal?'':' · using callsign'}</p>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="metrics">
        <div><div class="v">${p.points||0}</div><div class="k">Points</div></div>
        <div><div class="v">${fmtHrs(p.hours)}</div><div class="k">Hours</div></div>
        <div><div class="v">${esc(wLabel)}</div><div class="k">BW change</div></div>
      </div>
      <div class="prow"><span class="pm">${esc(sessionsProgressLabel(p.sessions,p.total,p.perWeek))} \u00b7 day ${p.day||1}</span>
        <span class="pm">${p.streak||0} streak</span></div>
      <div class="meta">
        <div class="field full"><label for="${uid}-league">League</label>
          <select id="${uid}-league">
            <option value="" ${!leagueVal?'selected':''}>Unassigned</option>
            <option value="brothers" ${leagueVal==='brothers'?'selected':''}>Brothers of the League</option>
            <option value="ladies" ${leagueVal==='ladies'?'selected':''}>Ladies of the League</option>
          </select></div>
        <div class="field full"><label for="${uid}-display">Display name (public board)</label>
          <input id="${uid}-display" type="text" maxlength="32" autocomplete="off" placeholder="Nickname on leaderboards" value="${esc(displayVal)}"></div>
        <div class="field full"><label for="${uid}-phone">Phone number</label>
          <input id="${uid}-phone" type="tel" inputmode="tel" autocomplete="off" placeholder="555-0100" value="${esc(phoneVal)}"></div>
        <div class="field"><label for="${uid}-start">Starting weight</label>
          <input id="${uid}-start" type="number" inputmode="decimal" step="0.1" min="1" max="1000" placeholder="lbs" value="${esc(startVal)}"></div>
        <div class="field"><label for="${uid}-cur">Current weight</label>
          <input id="${uid}-cur" type="number" inputmode="decimal" step="0.1" min="1" max="1000" placeholder="lbs" value="${esc(curVal)}"></div>
        <div class="field full"><label for="${uid}-started">Date started</label>
          <input id="${uid}-started" type="date" value="${esc(startedVal)}"></div>
      </div>
      <div class="save-row">
        <button type="button" class="btn accent sm" data-save>Save</button>
        <button type="button" class="btn textme sm" data-text title="Text this person">Text</button>
        <button type="button" class="btn wa sm" data-wa title="WhatsApp this person">WhatsApp</button>
        <button type="button" class="btn reset sm" data-reset title="Clear sessions, BW change, and start date — keep on roster">Reset</button>
      </div>
      <p class="okmsg" hidden></p>
      <p class="fine err" hidden></p>
    </div>`);

    const phoneInput=row.querySelector('#'+uid+'-phone');
    const textBtn=row.querySelector('[data-text]');
    const waBtn=row.querySelector('[data-wa]');
    const resetBtn=row.querySelector('[data-reset]');
    const syncTextBtn=()=>{
      const live=phoneInput.value.trim()||p.phone||'';
      const ok=hasPhone({phone:live});
      textBtn.disabled=false;
      waBtn.disabled=false;
      textBtn.title=ok?'Text this person':'Add a phone number first';
      waBtn.title=ok?'WhatsApp this person':'Add a phone number first';
      textBtn.style.opacity=ok?'':'0.7';
      waBtn.style.opacity=ok?'':'0.7';
    };
    phoneInput.oninput=syncTextBtn;
    syncTextBtn();

    row.querySelector('.trash').onclick=async()=>{
      if(!p.name)return;
      if(!confirm('Remove '+p.name+' from the roster?'))return;
      try{
        const r=await fetch('/api/roster/delete',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({pin,challenge:CONFIG.CHALLENGE,name:p.name})});
        const d=await r.json();
        if(!d.ok){alert(d.error==='bad pin'?'Organizer code rejected.':'Could not delete.');return}
        PEOPLE=PEOPLE.filter(x=>x!==p);
        renderDashboard(body);
      }catch(e){alert('Could not reach the roster.')}
    };

    resetBtn.onclick=async()=>{
      if(!p.name)return;
      if(!confirm('Reset '+p.name+'?\n\nClears sessions, streak, day, start date, weights / BW change, and logged workouts.\nKeeps callsign, league, and phone.\n\nIf their phone still has old weights saved, ask them to clear site data (or clear weight fields and Save) so it does not look ahead locally.'))return;
      const ok=row.querySelector('.okmsg');
      const bad=row.querySelector('.err');
      ok.hidden=true;bad.hidden=true;
      resetBtn.disabled=true;
      try{
        const r=await fetch('/api/roster/reset',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({pin,challenge:CONFIG.CHALLENGE,name:p.name})});
        const d=await r.json();
        if(!d.ok){
          bad.textContent=d.error==='bad pin'?'Organizer code rejected.':
            d.error==='not found'?'That person was not found.':'Could not reset.';
          bad.hidden=false;
          return;
        }
        p.sessions=0;
        p.streak=0;
        p.day=0;
        p.hours=0;
        p.points=0;
        p.hoursMilestones=0;
        p.weightMilestones=0;
        p.weightLostPct=null;
        p.weightDelta=null;
        p.startingWeight='';
        p.currentWeight='';
        p.dateStarted='';
        const startInput=row.querySelector('#'+uid+'-start');
        const curInput=row.querySelector('#'+uid+'-cur');
        const startedInput=row.querySelector('#'+uid+'-started');
        if(startInput) startInput.value='';
        if(curInput) curInput.value='';
        if(startedInput) startedInput.value='';
        const pm=row.querySelectorAll('.prow .pm');
        if(pm[0]) pm[0].textContent=sessionsProgressLabel(0,p.total,p.perWeek)+' · day 1';
        if(pm[1]) pm[1].textContent='0 streak';
        const mets=row.querySelectorAll('.metrics .v');
        if(mets[0]) mets[0].textContent='0';
        if(mets[1]) mets[1].textContent=fmtHrs(0);
        if(mets[2]) mets[2].textContent='—';
        const bar=row.querySelector('.pbar i');
        if(bar) bar.style.width='0%';
        ok.textContent='Progress and BW change reset. They are still on the roster.';
        ok.hidden=false;
      }catch(e){
        bad.textContent='Could not reach the roster.';
        bad.hidden=false;
      }finally{
        resetBtn.disabled=false;
      }
    };

    textBtn.onclick=()=>{
      const livePhone=phoneInput.value.trim()||p.phone||'';
      if(!hasPhone({phone:livePhone})){
        const bad=row.querySelector('.err');
        bad.textContent='Add a phone number (10+ digits), then Save — or Text will use what you typed.';
        bad.hidden=false;
        phoneInput.focus();
        return;
      }
      const usePhone=hasPhone(p)?(p.phone||livePhone):livePhone;
      SMS_TARGET={name:p.name,phone:usePhone};
      if(!String(SMS_DRAFT||'').trim()){
        SMS_DRAFT='Elevate Your Smoke — reminder from The Cigar Society.';
      }
      TAB='text';
      renderDashboard(body);
      const ta=document.getElementById('smsmsg');
      if(ta)ta.focus();
    };

    waBtn.onclick=()=>{
      const livePhone=phoneInput.value.trim()||p.phone||'';
      if(!hasPhone({phone:livePhone})){
        const bad=row.querySelector('.err');
        bad.textContent='Add a WhatsApp-capable mobile number (10+ digits), then Save.';
        bad.hidden=false;
        phoneInput.focus();
        return;
      }
      const usePhone=hasPhone(p)?(p.phone||livePhone):livePhone;
      if(!String(SMS_DRAFT||'').trim()){
        SMS_DRAFT='Elevate Your Smoke — reminder from The Cigar Society.';
      }
      if(openWhatsApp(usePhone, SMS_DRAFT)){
        const ok=row.querySelector('.okmsg');
        ok.textContent='Opening WhatsApp. Review the chat, then tap Send.';
        ok.hidden=false;
      }else{
        const bad=row.querySelector('.err');
        bad.textContent='Could not open WhatsApp. Use the Text tab instead.';
        bad.hidden=false;
      }
    };

    row.querySelector('[data-save]').onclick=async()=>{
      const ok=row.querySelector('.okmsg');
      const bad=row.querySelector('.err');
      ok.hidden=true;bad.hidden=true;
      const league=row.querySelector('#'+uid+'-league').value;
      const displayName=row.querySelector('#'+uid+'-display').value.trim();
      if(displayName && displayName.length<2){
        bad.textContent='Display name must be at least 2 characters (or leave blank).';
        bad.hidden=false;
        return;
      }
      const phone=phoneInput.value.trim();
      const startingWeight=row.querySelector('#'+uid+'-start').value.trim();
      const currentWeight=row.querySelector('#'+uid+'-cur').value.trim();
      const dateStarted=row.querySelector('#'+uid+'-started').value;
      try{
        const r=await fetch('/api/roster/update',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({pin,challenge:CONFIG.CHALLENGE,name:p.name,phone,startingWeight,currentWeight,dateStarted,league,displayName})});
        const d=await r.json();
        if(!d.ok){
          bad.textContent=d.error==='bad pin'?'Organizer code rejected.':
            d.error==='bad weight'?'Enter a valid weight.':
            d.error==='bad date'?'Enter a valid start date.':
            d.error==='bad display name'?'Display name must be 2–32 characters (or blank).':
            d.error==='not found'?'That person was not found.':'Could not save.';
          bad.hidden=false;
          return;
        }
        p.league=league;
        p.phone=phone;
        p.displayName=displayName;
        p.startingWeight=startingWeight===''?'':Number(startingWeight);
        p.currentWeight=currentWeight===''?'':Number(currentWeight);
        p.dateStarted=dateStarted;
        const pd=row.querySelector('.pd');
        if(pd)pd.textContent=leagueLabel(p.league)+' · '+ago(p.lastActive);
        const boardLine=row.querySelector('.fine');
        if(boardLine && boardLine.textContent.indexOf('Board shows')===0){
          boardLine.innerHTML='Board shows: <b style="color:var(--ink)">'+esc(displayName||p.name||'—')+'</b>'+(displayName?'':' · using callsign');
        }
        // Refresh derived scores locally
        const startW=p.startingWeight===''?null:Number(p.startingWeight);
        const curW=p.currentWeight===''?null:Number(p.currentWeight);
        if(startW!=null&&curW!=null&&startW>0){
          p.weightDelta=Math.round((startW-curW)*10)/10;
          p.weightLostPct=Math.round(((startW-curW)/startW)*1000)/10;
          p.weightMilestones=p.weightLostPct>0?Math.min(4,Math.floor(p.weightLostPct/5)):0;
        }else{
          p.weightDelta=null;p.weightLostPct=null;p.weightMilestones=0;
        }
        const hoursPct=p.total>0?(p.sessions/p.total)*100:0;
        p.hoursMilestones=Math.floor(hoursPct/5);
        p.points=(p.sessions||0)*10+Math.min(4,p.weightMilestones||0)*100+(p.hoursMilestones||0)*50;
        ok.textContent='Saved.';
        ok.hidden=false;
        syncTextBtn();
        // Update metrics display without full re-render so the save message stays
        const mets=row.querySelectorAll('.metrics .v');
        if(mets[0])mets[0].textContent=String(p.points||0);
        if(mets[2])mets[2].textContent=p.weightLostPct==null?'—':fmtLossPct(p.weightLostPct);
      }catch(e){
        bad.textContent='Could not reach the roster.';
        bad.hidden=false;
      }
    };

    list.appendChild(row);
  });
}

render();
</script>
</body>
</html>
