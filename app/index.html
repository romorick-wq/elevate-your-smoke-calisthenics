<style>
:root{
  --bg:#ECEAE4; --surface:#F7F6F2; --surface2:#FFFFFF; --ink:#101412;
  --muted:#5E6660; --line:rgba(16,20,18,.12); --accent:#C8F04D; --accent-ink:#1A2408;
  --olive:#2F3B2A; --olive-soft:#3F4F38; --danger:#C43C2C; --shadow:0 18px 50px rgba(16,20,18,.18);
  --disp:'Syne',system-ui,sans-serif; --body:'Outfit',system-ui,-apple-system,sans-serif; --mono:'Outfit',system-ui,sans-serif;
  --radius:18px; --radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;display:flex;justify-content:center;color:var(--ink);font-family:var(--body);
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(200,240,77,.28), transparent 55%),
    linear-gradient(165deg,#1a2218 0%, #2a3526 42%, #6d7464 100%);
}
#app{
  width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.sheet{padding:0 20px 36px;flex:1;display:flex;flex-direction:column;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.masthead{
  margin:0 -20px 18px;padding:16px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;
  background:linear-gradient(135deg,var(--olive),var(--olive-soft));color:#F4F7EE;border-bottom:0;
}
.masthead h1{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.02em;margin:0;text-transform:none;line-height:1}
.masthead .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-top:5px;display:block;font-weight:500}
.masthead .brand{min-width:0}
@media (max-width:400px){.masthead h1{font-size:19px}}
.masthead .no{font-size:11px;letter-spacing:.08em;opacity:.8;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.display{font-family:var(--disp);font-weight:800;letter-spacing:-.03em;line-height:.95;margin:0}
.h-xl{font-size:48px}.h-lg{font-size:34px}.h-md{font-size:24px;letter-spacing:-.02em}
p.lede{font-size:15.5px;line-height:1.55;color:#2c322e;margin:14px 0 0}
.fine{font-size:12.5px;line-height:1.5;color:var(--muted)}
.rule{height:1px;background:var(--line);margin:16px 0}
.rule.thin{height:1px;background:var(--line)}
.block{border:1px solid var(--line);background:var(--surface2);padding:14px;margin:0 0 12px;border-radius:var(--radius-sm)}
.block.invert{background:var(--olive);color:#F4F7EE;border-color:transparent}
.block.invert .eyebrow{color:rgba(244,247,238,.65)}
.btn{
  display:block;width:100%;border:0;background:var(--ink);color:#F7F6F2;border-radius:999px;
  font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:none;
  padding:15px 18px;cursor:pointer;box-shadow:none;transition:transform .12s ease, background .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.ghost:active{transform:scale(.98)}
.btn.sm{font-size:14px;padding:12px 16px}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.linkbtn{background:none;border:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  cursor:pointer;padding:8px 0;text-decoration:none;font-weight:600}
.linkbtn:hover{color:var(--ink)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.progress{display:flex;gap:5px;margin-bottom:8px}
.progress i{flex:1;height:4px;background:rgba(16,20,18,.1);border:0;border-radius:99px}
.progress i.on{background:var(--ink)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);
  background:var(--surface2);padding:13px 14px;margin-bottom:9px;cursor:pointer;font-family:var(--body);
  transition:border-color .12s, background .12s, transform .12s;border-radius:var(--radius-sm)}
.opt:hover{border-color:rgba(16,20,18,.28)}
.opt .box{flex:0 0 22px;height:22px;border:1.5px solid var(--ink);border-radius:7px;display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:14px;line-height:1;color:transparent}
.opt.sel{background:var(--ink);color:#F7F6F2;border-color:var(--ink)}
.opt.sel .box{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt .t{font-weight:600;font-size:15px;display:block}
.opt .s{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.opt.sel .s{color:rgba(247,246,242,.7)}
.buildline{font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;opacity:0;animation:fadein .35s forwards}
.buildline b{color:var(--olive-soft);font-weight:700}
@keyframes fadein{to{opacity:1}}
.statrow{display:flex;border:0;background:transparent;gap:8px}
.statrow div{flex:1;padding:14px 10px;text-align:center;border:0;background:var(--surface2);border-radius:var(--radius-sm)}
.statrow .n{font-family:var(--disp);font-weight:800;font-size:28px;line-height:1}
.statrow .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.weeks{display:flex;flex-direction:column;gap:7px}
.wk{display:flex;align-items:center;gap:7px}
.wk .lab{font-size:10px;color:var(--muted);width:20px;letter-spacing:.06em;font-weight:600}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;flex:1}
.cells.six{grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border:0;display:grid;place-items:center;font-family:var(--disp);
  font-weight:700;font-size:13px;color:var(--muted);background:rgba(16,20,18,.06);position:relative;border-radius:10px}
.cell.train{color:var(--ink);background:var(--surface2)}
.cell.next{background:var(--ink);color:var(--accent)}
.cell.done{background:rgba(200,240,77,.35);color:var(--olive)}
.cell.done::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--olive);bottom:5px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 0 4px 27px}
.dow span{text-align:center;font-size:9px;color:var(--muted)}
.movelist{margin:0;padding:0;list-style:none}
.movelist li{border-bottom:1px solid var(--line)}
.movelist li:last-child{border-bottom:0}
.mrow{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:11px 0;
  font-family:var(--body);font-size:14px;text-align:left;cursor:pointer;color:inherit}
.mrow .k{font-size:10px;letter-spacing:.08em;color:var(--muted);flex:0 0 50px;text-transform:uppercase;font-weight:600}
.mrow .m{flex:1;font-weight:600}
.mrow .d{font-size:12px;color:var(--muted)}
.mrow .see{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--olive-soft);letter-spacing:0}
.player{position:fixed;inset:0;background:#0E110F;z-index:50;display:flex;flex-direction:column;
  max-width:430px;margin:0 auto;color:#F4F7EE}
.player.rest{background:linear-gradient(180deg,#243022,#1a2218)}
.ptop{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.ptop .st{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:600}
.pmid{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:0 18px 10px;text-align:center;overflow:hidden;min-height:0}
.timer{font-family:var(--disp);font-weight:800;font-size:56px;line-height:.85;font-variant-numeric:tabular-nums;margin:8px 0 0;letter-spacing:-.04em}
.timer.big{font-size:88px}
.movename{font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1;margin:10px 0 0;text-transform:none}
.cue{font-size:14px;line-height:1.45;margin:8px 0 0;color:rgba(244,247,238,.78)}
.player.rest .cue{color:rgba(244,247,238,.85)}
.nextup{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:12px;opacity:.55;font-weight:600}
.figslot{flex:0 0 auto;margin:0 -18px 4px;min-height:0}
.demotip{margin:10px auto 0;max-width:340px;text-align:left;border-left:3px solid var(--accent);padding:6px 0 6px 12px;background:transparent}
.demotip .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,247,238,.55);display:block;margin-bottom:3px;font-weight:600}
.demotip .txt{font-size:13px;line-height:1.4;color:rgba(244,247,238,.9)}
.player.rest .demotip{display:none}
.howdots{display:flex;justify-content:center;gap:5px;margin-top:8px}
.howdots i{width:6px;height:6px;border:0;border-radius:50%;background:rgba(244,247,238,.25)}
.howdots i.on{background:var(--accent)}
.pbot{padding:12px 18px 8px;display:flex;gap:10px}
.pbot .btn{margin:0}
.player .btn{background:var(--accent);color:var(--accent-ink);border-radius:999px}
.player .btn.ghost{background:rgba(244,247,238,.08);color:#F4F7EE;border:1px solid rgba(244,247,238,.18)}
.player.rest .btn{background:var(--accent);color:var(--accent-ink);border:0;box-shadow:none}
.player.rest .btn.ghost{background:transparent;color:#F4F7EE;border:1px solid rgba(244,247,238,.25);box-shadow:none}
.bar{height:3px;background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s linear}
.player.rest .bar i{background:var(--accent)}
.stampwrap{display:grid;place-items:center;padding:26px 0 10px}
.stamp{width:150px;height:150px;border:3px solid var(--accent);border-radius:50%;display:grid;place-items:center;
  color:var(--accent-ink);background:var(--accent);transform:none;box-shadow:none;animation:press .45s cubic-bezier(.2,1.2,.5,1) both}
.stamp span{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.02em;text-align:center;line-height:.95}
.stamp small{display:block;font-size:11px;letter-spacing:.1em;margin-top:6px;opacity:.7;font-weight:600}
@keyframes press{from{transform:scale(1.35);opacity:0}to{transform:scale(1);opacity:1}}
.field{margin:14px 0 6px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input{width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;
  font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--ink);
  padding:4px 2px;border-radius:0;-webkit-appearance:none}
.field input::placeholder{color:#B6B8B2}
.person{border-bottom:1px solid var(--line);padding:12px 0}
.person.cold{opacity:.45}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pn{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em}
.pd,.pm{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:500}
.pbar{height:6px;border:0;margin:8px 0 5px;background:rgba(16,20,18,.08);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--olive-soft);border-radius:99px}
.note{border-left:3px solid var(--accent);padding:8px 0 8px 12px;margin:16px 0 0;font-size:13px;line-height:1.5;color:var(--muted);background:transparent}
.hidden{display:none}
.figbox{display:none}
.fig,.figmini,.fighero{display:none}
.eximg{display:block;width:100%;height:auto;object-fit:cover;background:#1a1f1c}
.eximg.mini{width:72px;height:72px;flex:0 0 72px;border-radius:14px;object-fit:cover}
.eximg.hero{width:100%;height:min(42vh,320px);max-height:42vh;object-fit:cover;border-radius:0}
.eximg.card{aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius-sm)}
.eximg.cover{width:100%;height:42vh;min-height:220px;object-fit:cover;display:block}
.photoframe{overflow:hidden;border-radius:0 0 28px 28px;margin:0 -20px 18px;position:relative}
.photoframe::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,20,18,.05),rgba(16,20,18,.55));pointer-events:none}
.photoframe .brandmark{position:absolute;left:20px;bottom:18px;z-index:1;color:#F7F6F2}
.photoframe .brandmark h1{font-family:var(--disp);font-weight:800;font-size:34px;margin:0;letter-spacing:-.03em;line-height:.95}
.photoframe .brandmark span{display:block;margin-top:6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface2);
  padding:8px;width:100%;text-align:left;cursor:pointer;font-family:var(--body);margin-bottom:8px;color:inherit;border-radius:var(--radius-sm)}
.mcard .nm{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-.02em;line-height:1.1}
.mcard .sub{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:4px;font-weight:600}
.mcard:hover{border-color:rgba(16,20,18,.28)}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(10,12,11,.62);display:flex;justify-content:center;align-items:flex-end;backdrop-filter:blur(6px)}
.card{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--bg);border-top:0;
  padding:18px 20px 28px;animation:slideup .28s ease-out;border-radius:28px 28px 0 0}
@keyframes slideup{from{transform:translateY(40px);opacity:.2}to{transform:none;opacity:1}}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);font-family:var(--disp);font-weight:800;font-size:16px;color:var(--olive-soft);flex:0 0 16px;line-height:1.2}
.watch{background:var(--olive);color:#F4F7EE;padding:12px 14px;margin-top:12px;font-size:13.5px;line-height:1.45;border-radius:var(--radius-sm)}
.watch b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:4px;opacity:.7;font-weight:600}
.briefcard{position:relative;overflow:hidden;border-radius:var(--radius-sm);cursor:pointer;border:0;padding:0;background:transparent;width:100%;text-align:left;color:#fff}
.briefcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.briefcard .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 10px;background:linear-gradient(transparent,rgba(10,12,11,.85))}
.briefcard .cap .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600}
.briefcard .cap .n{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>

<div id="app"></div>
<script>
/* =========================================================
   ELEVATE YOUR SMOKE — 9 minutes a day, 30-day card
   =========================================================

   ================= SETUP: EDIT THESE LINES =================
   SYNC_URL   Railway API base. Use '/api' when this app is hosted
              by the same Railway service (default). Leave empty
              to keep progress on-device only. Or paste a full
              https://….up.railway.app/api URL if hosting the
              HTML separately.
   CHALLENGE  short tag for this round. Change it when you start
              a new group so the rosters stay separate.
   Organizer code lives in the Railway ORGANIZER_CODE env var.
   ================================================================ */
const CONFIG={
  SYNC_URL:'/api',
  CHALLENGE:'smoke-30'
};

const KEY='smoke30:v1';
let S={profile:null,log:{},screen:'cover',qi:0,answers:{},session:null,si:0,timeLeft:0,paused:false,tick:null,tipTick:null,rafs:[],back:'plan'};

/* ---------- movement library ---------- */
const M={
 warm:[
  {n:'March in place',c:'Drive the knees to hip height. Keep the arms swinging.',t:[]},
  {n:'Arm circles',c:'Big slow circles forward, then back. Open the chest.',t:[]},
  {n:'Hip openers',c:'Knee up, sweep it out to the side, step down. Alternate.',t:[]},
  {n:'Shoulder rolls',c:'Roll them up, back and down. Slow and full.',t:[]},
  {n:'Standing side bend',c:'Reach one arm overhead, lean away, feel the ribs open.',t:[]}
 ],
 push:[
  {n:'Wall push-up',c:'Hands on the wall at chest height. Lower slow, press away.',t:[]},
  {n:'Incline push-up',c:'Hands on a counter or sturdy table. Elbows at 45\u00b0, chest to the edge.',t:[]},
  {n:'Push-up',c:'Hands under the shoulders. Ribs down, full lockout at the top.',t:['shoulder']},
  {n:'Diamond push-up',c:'Thumbs and index fingers touching. Elbows brush the ribs.',t:['shoulder']}
 ],
 pull:[
  {n:'Doorway row',c:'Grip both sides of a door frame, lean back, pull your chest to your hands.',t:[]},
  {n:'Table row',c:'Lie under a sturdy table, grip the edge, pull your chest up. Body in one line.',t:[]},
  {n:'Table row, legs out',c:'Same pull, heels further away. Slower on the way down.',t:['shoulder']},
  {n:'Pull-up',c:'Full hang to chin over the bar. Control the descent.',t:['shoulder']}
 ],
 squat:[
  {n:'Sit-to-stand',c:'From a chair. Stand without hands if you can, sit down slow.',t:[]},
  {n:'Box squat',c:'Squat to a chair, touch, drive up. Knees track over the toes.',t:[]},
  {n:'Bodyweight squat',c:'Feet shoulder-width. Down until the hips break parallel.',t:['knee']},
  {n:'Split squat',c:'One foot back. Drop the back knee straight down. Swap halfway.',t:['knee']}
 ],
 hinge:[
  {n:'Glute bridge',c:'Heels close, drive the hips up, squeeze at the top.',t:[]},

const pt=(x,y,a,l)=>{const r=a*Math.PI/180;return [x+l*Math.sin(r),y+l*Math.cos(r)]};

function joints(p){
  const pel=[p.x,p.y];
  const nk=pt(p.x,p.y,p.t,SEG.sp);
  const hd=pt(nk[0],nk[1],p.t,SEG.hd);
  const arms=[0,1].map(i=>{const e=pt(nk[0],nk[1],p.s[i],SEG.ua);return [e,pt(e[0],e[1],p.e[i],SEG.fa)]});
  const legs=[0,1].map(i=>{const k=pt(pel[0],pel[1],p.h[i],SEG.th);const f=pt(k[0],k[1],p.k[i],SEG.sn);
    return [k,f,pt(f[0],f[1],p.f[i],SEG.ft)]});
  return {pel,nk,hd,arms,legs};
}
const dlt=(a,b)=>((b-a+540)%360)-180;
function lerpPose(a,b,u){
  const o={x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u,t:a.t+dlt(a.t,b.t)*u};
  ['s','e','h','k','f'].forEach(kk=>o[kk]=[0,1].map(i=>a[kk][i]+dlt(a[kk][i],b[kk][i])*u));
  return o;
}

  wrap.className='figbox '+(cls||'');
  if(!ex)return wrap;
  wrap.innerHTML='<svg class="fig" viewBox="0 0 120 84" role="img" aria-label="Diagram of '+name+'"></svg>';
  const svg=wrap.querySelector('svg'),props=propsSVG(ex.props);
  const draw=u=>{svg.innerHTML=props+bodySVG(lerpPose(ex.a,ex.b,u))};
  if(REDUCED()){draw(1);return wrap}
  const t0=performance.now();
  const loop=()=>{
    if(!wrap.isConnected)return;
    const u=(1-Math.cos((performance.now()-t0)/2400*Math.PI*2))/2;
    draw(u);S.rafs.push(requestAnimationFrame(loop));
  };
  loop();
  return wrap;
}
function staticFigure(name,cls){
  const ex=EX[name],wrap=document.createElement('div');
  wrap.className='figbox '+(cls||'');
  if(!ex)return wrap;
  wrap.innerHTML='<svg class="fig" viewBox="0 0 120 84" aria-hidden="true">'+propsSVG(ex.props)+bodySVG(ex.b)+'</svg>';
  return wrap;
}

}

];
const WEEK={3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};
const DAYS=30,SESSION_SEC=540;
const FOCUS={A:'Push \u00b7 Legs \u00b7 Core',B:'Pull \u00b7 Hips \u00b7 Core',C:'Full-body conditioning'};

function pick(cat,lvl,avoid,offset){
  const list=M[cat].filter(m=>!m.t.includes(avoid));
  const i=Math.min(list.length-1,Math.max(0,lvl-1+(offset||0)));
  return list[i]||list[list.length-1];
}
function levelFor(p,block){
  let l=p.level;
  if(p.age==='60')l=Math.max(1,l-1);
  if(p.age==='45'&&l>2)l=2;
  if(p.goal==='move')l=Math.max(1,l-1);
  if(block>=2)l=Math.min(4,l+1);
  return l;
}
function schedule(p){
  const days=WEEK[p.days],out=[];let n=0;
  for(let i=0;i<DAYS;i++){
    const train=days.includes(i%7);
    out.push({i,block:Math.floor(i/10),train,type:train?['A','B','C'][n++%3]:null});
  }
  return out;
}
function buildSession(slot,p){
  const lvl=levelFor(p,slot.block),av=p.limit==='none'?'':p.limit;
  const work=lvl<=1?20:25,rest=30-work,rounds=3;
  const gearPull=p.gear==='bar'?1:0;
  let main;
  if(slot.type==='A')main=[pick('push',lvl,av),pick('squat',lvl,av),pick('core',lvl,av),pick('cardio',lvl,av,-1)];
  else if(slot.type==='B')main=[pick('pull',lvl+gearPull,av),pick('hinge',lvl,av),pick('core',lvl,av,1),pick('cardio',lvl,av,-1)];
  else main=[pick('cardio',lvl,av),pick('squat',lvl,av,-1),pick('push',lvl,av,-1),pick('core',lvl,av)];
  const steps=[],b=slot.block,d=slot.i;
  [M.warm[d%M.warm.length],M.warm[(d+2)%M.warm.length]]
    .forEach(m=>steps.push({kind:'work',phase:'Warm-up',n:m.n,c:m.c,sec:30}));
  for(let r=1;r<=rounds;r++){
    main.forEach((m,i)=>{
      steps.push({kind:'work',phase:'Round '+r+' of '+rounds,n:m.n,c:m.c,sec:work});
      const last=(r===rounds&&i===main.length-1);
      steps.push({kind:'rest',phase:'Rest',n:'Rest',c:last?'Last effort coming up.':'Shake it out. Breathe through the nose.',sec:rest});
    });
  }
  steps.push({kind:'work',phase:'Finisher',n:main[3].n,c:'Everything left. Steady pace, no sloppy reps.',sec:60});
  const cd=M.cool.filter(m=>!m.t.includes(av));
  [cd[d%cd.length],cd[(d+1)%cd.length]]
    .forEach(m=>steps.push({kind:'work',phase:'Cool-down',n:m.n,c:m.c,sec:30}));
  return {type:slot.type,block:b,day:d,steps,main,rounds,work,rest,lvl};
}
const mins=s=>Math.round(s.steps.reduce((a,b)=>a+b.sec,0)/60);

/* ---------- storage ---------- */
/* Saves through Claude's artifact storage when it is there, and through the
   browser's own storage when the file is hosted anywhere else. */
const DB={
  async get(k){
    try{if(window.storage&&window.storage.get)return await window.storage.get(k)}catch(e){}
    try{const v=localStorage.getItem(k);return v?{key:k,value:v}:null}catch(e){return null}
  },
  async set(k,v){
    try{if(window.storage&&window.storage.set)return await window.storage.set(k,v)}catch(e){}
    try{localStorage.setItem(k,v)}catch(e){}
    return {key:k,value:v};
  }
};
async function save(){try{await DB.set(KEY,JSON.stringify({profile:S.profile,log:S.log,me:S.me}))}catch(e){}}
async function boot(){
  try{const r=await DB.get(KEY);
    if(r&&r.value){const d=JSON.parse(r.value);S.profile=d.profile;S.log=d.log||{};S.me=d.me||null;
      S.screen=S.profile?'plan':'cover'}
  }catch(e){}
  installable();
  render();
  flushQueue();
  if(S.me)report('ping');
}

/* =========================================================
   ROSTER SYNC  —  identity, reporting, organizer dashboard
   ========================================================= */
const QKEY='smoke30:queue';
const API=()=>{
  try{const q=new URLSearchParams(location.search).get('api');if(q)return q}catch(e){}
  const u=(CONFIG.SYNC_URL||'').trim();
  if(!u)return '';
  // Relative /api only works when the app is served over http(s), not from disk
  if(u.startsWith('/')&&typeof location!=='undefined'&&location.protocol==='file:')return '';
  return u;
};
const tracking=()=>!!API();

/* ---- identity: a display name and a random device id, nothing else ---- */
function setMe(name){
  S.me={id:'p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),
        name:name.trim().slice(0,32),joined:Date.now()};
  save();return S.me;
}
/* ---- transport: never blocks the workout; failures go in a queue ---- */
async function apiPost(body){
  if(!tracking())return null;
  const r=await fetch(API(),{method:'POST',redirect:'follow',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return await r.json();
}
function queueAdd(b){try{const q=JSON.parse(localStorage.getItem(QKEY)||'[]');q.push(b);
  localStorage.setItem(QKEY,JSON.stringify(q.slice(-40)))}catch(e){}}
async function flushQueue(){
  if(!tracking())return;
  let q=[];try{q=JSON.parse(localStorage.getItem(QKEY)||'[]')}catch(e){return}
  if(!q.length)return;
  const left=[];
  for(const b of q){try{await apiPost(b)}catch(e){left.push(b)}}
  try{localStorage.setItem(QKEY,JSON.stringify(left))}catch(e){}
}
function report(action){
  if(!tracking()||!S.me)return;
  const sl=S.profile?schedule(S.profile):[];
  const total=sl.filter(s=>s.train).length;
  const nextS=S.profile?nextSlot():null;
  const body={action,challenge:CONFIG.CHALLENGE,id:S.me.id,name:S.me.name,
    sessions:Object.keys(S.log).length,total,streak:S.profile?streak():0,
    day:nextS?nextS.i+1:(S.profile?30:0),perWeek:S.profile?S.profile.days:0};
  apiPost(body).catch(()=>queueAdd(body));
}

  const wk=Date.now()-7*864e5;

  const done=people.filter(p=>p.total&&p.sessions>=p.total).length;
  body.appendChild(el(`<div class="statrow" style="margin-top:16px">
    <div><div class="n">${people.length}</div><div class="l">On roster</div></div>

    const pct=p.total?Math.round(100*p.sessions/p.total):0;

/* ---------- plan ---------- */
function nextSlot(){return schedule(S.profile).find(s=>s.train&&!S.log[s.i])}
function streak(){
  const sl=schedule(S.profile).filter(s=>s.train);let n=0;
  for(const s of sl){if(S.log[s.i])n++;else break}
  return n;
}
function plan(a){
  const p=S.profile,sl=schedule(p),next=nextSlot();
  const total=sl.filter(s=>s.train).length,doneN=Object.keys(S.log).length;
  const sess=next?buildSession(next,p):null;
  const num=next?sl.filter(s=>s.train).indexOf(next)+1:total;
  a.appendChild(el(`<div class="sheet">${head('CARD \u00b7 30 DAY')}
    <div class="statrow">
      <div><div class="n">${doneN}</div><div class="l">Logged</div></div>
      <div><div class="n">${streak()}</div><div class="l">Streak</div></div>
      <div><div class="n">${total-doneN}</div><div class="l">To go</div></div>
    </div>
    <div id="today"></div>
    <p class="eyebrow" style="margin-top:22px">The card \u00b7 thirty days</p>
    <div class="weeks" id="weeks"></div>
    <div class="rule thin" style="margin-top:22px"></div>
    <p class="fine"><b>A</b> ${FOCUS.A} \u00b7 <b>B</b> ${FOCUS.B} \u00b7 <b>C</b> ${FOCUS.C}. Blank days are rest \u2014 they are part of the plan, not a gap in it. The last ten days step every movement up a level.</p>
    <button class="btn ghost sm" id="man" style="margin-top:14px">Movement manual</button>
    <div style="text-align:center;margin-top:4px"><button class="linkbtn" id="org">Organizer</button>
    <button class="linkbtn" id="reset" style="margin-left:14px">Start a new card</button></div>
  </div>`));
  const t=document.getElementById('today');
  if(sess){
    t.appendChild(el(`<div class="block invert" style="margin-top:12px">
      <p class="eyebrow">Day ${next.i+1} of 30 \u00b7 session ${num} of ${total}</p>
      <h3 class="display h-md" style="margin:2px 0 0">${FOCUS[sess.type]}</h3>
      <p style="font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;margin:9px 0 0;opacity:.85">
        9 MIN \u00b7 ${sess.rounds} ROUNDS \u00b7 ${sess.work}S ON / ${sess.rest}S OFF</p></div>`));
    const list=el('<div class="block"><p class="eyebrow">Movements today \u2014 tap to see one</p><ul class="movelist"></ul></div>');
    const ul=list.querySelector('ul');
    sess.main.forEach((m,i)=>ul.appendChild(moveRow(['Push','Legs','Core','Pace'][i],m.n,sess.work+'s')));
    t.appendChild(list);
    const b=el('<button class="btn accent" id="start">Begin session</button>');
    t.appendChild(b);
    b.onclick=()=>{S.session=sess;S.slot=next;S.screen='brief';render()};
  }else{
    t.appendChild(el(`<div class="block invert" style="margin-top:12px">
      <p class="eyebrow">Card complete</p>
      <h3 class="display h-md" style="margin:2px 0 0">All ${total} sessions logged</h3>
      <p style="font-size:14px;line-height:1.5;margin:10px 0 0">Thirty days done. Start a fresh card and it rebuilds a level higher from where you finished.</p></div>`));
    const b=el('<button class="btn" id="again">Build the next card</button>');
    t.appendChild(b);
    b.onclick=()=>{if(S.profile.level<3)S.profile.level++;S.log={};save();render()};
  }
  const W=document.getElementById('weeks');
  for(let r=0;r<5;r++){
    const row=el(`<div class="wk"><span class="lab">${String(r*6+1).padStart(2,'0')}</span><div class="cells six"></div></div>`);
    const c=row.querySelector('.cells');
    for(let d=0;d<6;d++){
      const s=sl[r*6+d],isNext=next&&next.i===s.i;
      const cls=['cell',s.train?'train':'',S.log[s.i]?'done':'',isNext?'next':''].filter(Boolean).join(' ');
      c.appendChild(el(`<div class="${cls}">${s.train?s.type:'\u00b7'}</div>`));
    }
    W.appendChild(row);
  }
  document.getElementById('man').onclick=()=>{S.back='plan';S.screen='manual';render()};
  document.getElementById('org').onclick=()=>{S.screen='coach';render()};
  document.getElementById('reset').onclick=()=>{
    if(confirm('This clears your logged sessions and runs the questions again.')){
      S.profile=null;S.log={};save();S.screen='cover';render();}
  };
}
/* ---------- movement manual ---------- */
function manual(a){
  a.appendChild(el(`<div class="sheet">${head('MANUAL')}
    <p class="eyebrow">Every movement in the program</p>
    <h2 class="display h-lg">The<br>manual</h2>
    <p class="fine" style="margin:12px 0 18px">Tap any movement for the form photo, the three cues that matter, and the mistake to watch for.</p>
    <div id="cats"></div>
    <button class="btn" id="back" style="margin-top:8px">Back</button></div>`));
  const C=document.getElementById('cats');
  Object.keys(M).forEach(cat=>{
    C.appendChild(el(`<p class="eyebrow" style="margin:18px 0 8px">${esc(CATNAME[cat])}</p>`));
    M[cat].forEach((m,i)=>{
      const card=el(`<button class="mcard"><span class="figholder"></span>
        <span><span class="nm">${esc(m.n)}</span><span class="sub">${cat==='warm'||cat==='cool'?'\u2014':'Level '+(i+1)}</span></span></button>`);
      card.querySelector('.figholder').replaceWith(exerciseImg(m.n,'mini'));
      card.onclick=()=>showMove(m.n);
      C.appendChild(card);
    });
  });
  document.getElementById('back').onclick=()=>{S.screen=S.back||'plan';render()};
}
/* ---------- brief ---------- */
function brief(a){
  const s=S.session;
  a.appendChild(el(`<div class="sheet">${head('BRIEF')}
    <p class="eyebrow">Day ${s.day+1} of 30 \u00b7 ${FOCUS[s.type]}</p>
    <h2 class="display h-lg">Nine minutes.<br>${s.rounds} rounds.</h2>
    <div class="rule"></div>
    <p class="eyebrow">Today\u2019s moves \u2014 tap for cues</p>
    <div id="figs" class="grid4"></div>
    <div class="block" style="margin-top:14px"><p class="eyebrow">The circuit</p><ul class="movelist" id="ml"></ul></div>
    <p class="fine">Each work interval shows the form photo plus rotating cues. Work at a pace you could hold for one more round. Skip anything that hurts and the session still counts.</p>
    <div style="flex:1;min-height:16px"></div>
    <button class="btn accent" id="go">Start the clock</button>
    <div style="text-align:center"><button class="linkbtn" id="back">Back to the card</button></div></div>`));
  const F=document.getElementById('figs');
  const labels=['Push','Legs','Core','Pace'];
  s.main.forEach((m,i)=>{
    const cell=el(`<button type="button" class="briefcard">
      <span class="imgholder"></span>
      <span class="cap"><span class="k">${esc(labels[i])}</span><span class="n">${esc(m.n)}</span></span>
    </button>`);
    const img=exerciseImg(m.n,'card');
    img.style.borderRadius='0';
    img.style.aspectRatio='1';
    cell.querySelector('.imgholder').replaceWith(img);
    cell.onclick=()=>showMove(m.n);
    F.appendChild(cell);
  });
  const ml=document.getElementById('ml');
  s.main.forEach((m,i)=>ml.appendChild(moveRow(labels[i],m.n,s.work+'s')));
  document.getElementById('go').onclick=()=>startSession();
  document.getElementById('back').onclick=()=>{S.screen='plan';render()};
}
/* ---------- player ---------- */
function startSession(){
  S.si=0;S.paused=false;
  document.querySelectorAll('.player').forEach(n=>n.remove());
  document.body.appendChild(el('<div class="player" id="player"></div>'));
  loadStep();
}
function loadStep(){
  const st=S.session.steps[S.si];
  if(!st){endSession();return}
  S.timeLeft=st.sec;paintStep();
  clearInterval(S.tick);
  S.tick=setInterval(()=>{
    if(S.paused)return;
    S.timeLeft--;
    const t=document.getElementById('t');if(t)t.textContent=mmss(Math.max(0,S.timeLeft));
    const b=document.getElementById('barfill');if(b)b.style.width=(100*(1-S.timeLeft/st.sec))+'%';
    if(S.timeLeft<=0){clearInterval(S.tick);if(S.tipTick){clearInterval(S.tipTick);S.tipTick=null}S.si++;loadStep()}
  },1000);
}
function demoTips(name){
  const ex=EX[name];
  if(!ex)return {lines:[],watch:''};
  return {lines:ex.how.slice(),watch:ex.watch||''};
}
function paintStep(){
  const s=S.session,st=s.steps[S.si],nx=s.steps[S.si+1],p=document.getElementById('player');
  clearRafs();
  if(S.tipTick){clearInterval(S.tipTick);S.tipTick=null}
  const tips=st.kind==='work'?demoTips(st.n):{lines:[],watch:''};
  const tipLines=tips.lines.length?tips.lines.concat(tips.watch?['Watch for: '+tips.watch]:[]):[st.c];
  let tipI=0;
  p.className='player'+(st.kind==='rest'?' rest':'');
  p.innerHTML=`<div class="ptop"><span class="st">${esc(st.phase)}</span><span class="st">${S.si+1} / ${s.steps.length}</span></div>
    <div class="bar"><i id="barfill" style="width:0%"></i></div>
    <div class="pmid">
      <div class="figslot" id="figslot"></div>
      <p class="timer ${st.kind==='rest'?'big':''}" id="t">${mmss(st.sec)}</p>
      <h2 class="movename">${esc(st.n)}</h2>
      <p class="cue" id="cue">${esc(st.c)}</p>
      ${st.kind==='work'&&tips.lines.length?`<div class="demotip" id="demotip"><span class="lab" id="demolab">How it goes</span><div class="txt" id="demotxt">${esc(tipLines[0])}</div>
        <div class="howdots" id="howdots">${tipLines.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div></div>`:''}
      ${nx?`<p class="nextup">Next \u2192 ${esc(nx.n)}</p>`:'<p class="nextup">Last one</p>'}
    </div>
    <div class="pbot">
      <button class="btn ghost sm" id="pause" style="flex:1">${S.paused?'Resume':'Pause'}</button>
      <button class="btn sm" id="skip" style="flex:1.6">${st.kind==='rest'?'Skip rest':'Done \u2192'}</button>
    </div>
    <div style="text-align:center;padding-bottom:16px"><button class="linkbtn" id="quit">End session</button></div>`;
  if(st.kind==='work'&&EX[st.n]){
    p.querySelector('#figslot').appendChild(exerciseImg(st.n,'hero'));
  }
  if(st.kind==='work'&&tipLines.length>1){
    S.tipTick=setInterval(()=>{
      if(S.paused)return;
      tipI=(tipI+1)%tipLines.length;
      const txt=document.getElementById('demotxt');
      const lab=document.getElementById('demolab');
      const dots=document.getElementById('howdots');
      if(!txt)return;
      const isWatch=tips.watch&&tipI===tipLines.length-1;
      if(lab)lab.textContent=isWatch?'Watch for':'How it goes';
      txt.textContent=isWatch?tips.watch:tipLines[tipI];
      if(dots)[...dots.children].forEach((d,i)=>d.className=i===tipI?'on':'');
    },3200);
  }
  p.querySelector('#pause').onclick=()=>{S.paused=!S.paused;p.querySelector('#pause').textContent=S.paused?'Resume':'Pause'};
  p.querySelector('#skip').onclick=()=>{clearInterval(S.tick);if(S.tipTick){clearInterval(S.tipTick);S.tipTick=null}S.si++;loadStep()};
  p.querySelector('#quit').onclick=()=>{
    if(confirm('End here? This session will not be marked on the card.')){
      clearInterval(S.tick);if(S.tipTick){clearInterval(S.tipTick);S.tipTick=null}
      clearRafs();p.remove();S.screen='plan';render();}
  };
}
function endSession(){
  clearInterval(S.tick);if(S.tipTick){clearInterval(S.tipTick);S.tipTick=null}clearRafs();
  const p=document.getElementById('player');if(p)p.remove();
  S.log[S.slot.i]={at:Date.now()};save();report('log');
  S.screen='done';render();
}
function doneScreen(a){
  const total=schedule(S.profile).filter(s=>s.train).length,n=Object.keys(S.log).length;
  a.appendChild(el(`<div class="sheet">${head('LOGGED')}
    <div class="stampwrap"><div class="stamp"><span>Done<small>Session ${n} of ${total}</small></span></div></div>
    <h2 class="display h-lg" style="text-align:center">${n===1?'First one<br>is on the card.':'That is '+n+'<br>on the card.'}</h2>
    <p class="lede" style="text-align:center">${n<total?'The next session unlocks now. Rest days between are doing work too \u2014 that is when the strength actually shows up.':'Thirty days, all of it logged. Build the next card when you are ready.'}</p>
    <div style="flex:1;min-height:20px"></div>
    <button class="btn" id="back">Back to the card</button></div>`));
  document.getElementById('back').onclick=()=>{S.screen='plan';render()};
}
boot();

</script>
</body>
</html>
